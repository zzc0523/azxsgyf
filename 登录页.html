<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · 福建省综合风险减量服务平台</title>
<style>
  :root{--blue:#2b5ce6;--blue-d:#1f49c4;--text:#1f2329;--sub:#a6adbd;--line:#dfe3ec;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#0e1320}
  /* 手机外壳 */
  .phone{position:relative;width:390px;height:844px;background:#fff;border-radius:46px;overflow:hidden;border:11px solid #232734;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#232734;border-radius:0 0 18px 18px;z-index:9}
  /* 背景渐变 + 云纹 */
  .bg{position:absolute;inset:0;background:linear-gradient(180deg,#4f7ff0 0%,#7ba2f6 14%,#c3d8ff 30%,#eef4ff 46%,#ffffff 62%)}
  .bg::after{content:"";position:absolute;inset:0;
    background:
      radial-gradient(closest-side,rgba(255,255,255,.35),transparent) 12% 16%/150px 70px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.28),transparent) 78% 24%/190px 90px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.22),transparent) 30% 40%/220px 100px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.18),transparent) 90% 44%/160px 80px no-repeat;}
  .statusbar{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;color:#fff;z-index:5}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  .statusbar .icons svg{display:block}
  .content{position:relative;z-index:5;padding:6px 30px 0;height:calc(100% - 44px);display:flex;flex-direction:column}
  .toprow{display:flex;align-items:center;justify-content:space-between}
  .close{width:34px;height:34px;font-size:20px;color:#fff;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;opacity:.95}
  /* 小程序胶囊按钮 */
  .capsule{display:flex;align-items:center;height:32px;padding:0 13px;border-radius:16px;
    background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .cap-dots{color:#fff;font-size:14px;letter-spacing:2px;line-height:1;padding-bottom:5px;cursor:pointer}
  .cap-line{width:1px;height:15px;background:rgba(255,255,255,.4);margin:0 9px}
  .cap-circ{width:17px;height:17px;border-radius:50%;border:1.6px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cap-circ i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
  /* 两个 Logo */
  .logos{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:34px}
  .logo-red{width:66px;height:66px;border-radius:14px;background:linear-gradient(145deg,#f0522f,#d32f1f);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(211,47,31,.35);position:relative;overflow:hidden}
  .logo-red::before,.logo-red::after{content:"";position:absolute;width:34px;height:6px;background:#fff;border-radius:3px;transform:rotate(-30deg)}
  .logo-red::before{top:20px;left:12px}
  .logo-red::after{bottom:20px;right:12px}
  .logo-blue{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#4a86e8,#1b4fc4);
    position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(27,79,196,.35)}
  .logo-blue .ring{position:absolute;inset:6px;border:2px solid #fff;border-radius:50%}
  .logo-blue .mount{width:26px;height:18px;border-bottom:2px solid #fff;position:relative}
  .logo-blue .mount::before,.logo-blue .mount::after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
  .logo-blue .mount::before{left:0;border-width:0 9px 18px 9px;border-color:transparent transparent #fff transparent}
  .logo-blue .mount::after{right:0;border-width:0 11px 14px 11px;border-color:transparent transparent rgba(255,255,255,.75) transparent}
  h1{font-size:19px;text-align:center;color:#1f2329;font-weight:700;margin:20px 0 0;letter-spacing:.5px}
  /* 表单 */
  .form{margin-top:38px;display:flex;flex-direction:column}
  .input{width:100%;height:52px;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:0 16px;font-size:15px;color:var(--text);outline:none;margin-bottom:16px;transition:.2s}
  .input::placeholder{color:var(--sub)}
  .input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,92,230,.12)}
  .login-btn{width:100%;height:52px;border:none;border-radius:12px;background:var(--blue);color:#fff;
    font-size:17px;font-weight:600;letter-spacing:4px;cursor:pointer;box-shadow:0 8px 18px rgba(43,92,230,.3);transition:.15s}
  .login-btn:active{background:var(--blue-d);transform:translateY(1px)}
  .forgot{color:var(--blue);font-size:14px;text-decoration:none;margin:14px 0 0;font-weight:500;cursor:pointer}
  /* 提示气泡 */
  .tip{display:none;align-self:flex-start;background:#8c93a3;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;margin:16px 0 8px}
  .tip.show{display:block;animation:pop .2s}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .agree{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b91a0;margin-top:2px}
  .agree .cb{width:16px;height:16px;border-radius:50%;border:1.5px solid #c2c8d6;flex-shrink:0;cursor:pointer;position:relative;transition:.15s}
  .agree .cb.on{background:var(--blue);border-color:var(--blue)}
  .agree .cb.on::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
  .agree a{color:#5a6272;text-decoration:none}
  .agree a.hl{color:var(--blue)}
  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#111;opacity:.35}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,28,46,.9);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:20;display:none}
  .toast.show{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="bg"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="#fff">
        <rect x="0" y="7.6" width="3.1" height="3.4" rx="1"/>
        <rect x="4.65" y="5.3" width="3.1" height="5.7" rx="1"/>
        <rect x="9.3" y="3" width="3.1" height="8" rx="1"/>
        <rect x="13.95" y="0.7" width="3.1" height="10.3" rx="1"/>
      </svg>
      <svg viewBox="0 0 15.5 11.2" width="15.5" height="11.2" fill="#fff">
        <path d="M7.75 11.2 5.95 9.2a2.7 2.7 0 0 1 3.6 0L7.75 11.2Z"/>
        <path d="M7.75 5.85c1.55 0 2.95.6 4 1.65L10.6 8.8a4.1 4.1 0 0 0-5.7 0L3.75 7.5a5.8 5.8 0 0 1 4-1.65Z" opacity=".92"/>
        <path d="M7.75 1.95c2.55 0 4.9 1 6.65 2.65L13.25 5.9A7.95 7.95 0 0 0 7.75 3.7c-2.1 0-3.95.8-5.5 2.2L1.1 4.6A9.55 9.55 0 0 1 7.75 1.95Z" opacity=".82"/>
      </svg>
      <svg viewBox="0 0 25 12" width="25" height="12">
        <rect x="0.7" y="0.7" width="20.3" height="10.6" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
        <rect x="2.4" y="2.4" width="16.9" height="7.2" rx="1.8" fill="#fff"/>
        <path d="M22.6 3.9v4.2c1.05-.35 1.8-1.2 1.8-2.1s-.75-1.75-1.8-2.1Z" fill="#fff" fill-opacity=".5"/>
      </svg>
    </span>
  </div>

  <div class="content">
    <div class="toprow">
      <div class="close" onclick="toast('已关闭')">✕</div>
      <div class="capsule">
        <span class="cap-dots" onclick="toast('更多')">•••</span>
        <span class="cap-line"></span>
        <span class="cap-circ" onclick="toast('设置')"><i></i></span>
      </div>
    </div>

    <div class="logos">
      <div class="logo-red"></div>
      <div class="logo-blue"><div class="ring"></div><div class="mount"></div></div>
    </div>
    <h1>福建省综合风险减量服务平台</h1>

    <div class="form">
      <input class="input" id="phone" maxlength="11" placeholder="请输入手机号">
      <input class="input" id="pwd" type="password" placeholder="请输入密码">
      <button class="login-btn" onclick="doLogin()">登录</button>
      <a class="forgot" onclick="toast('请联系管理员重置密码')">忘记密码</a>

      <div class="tip" id="tip">请勾选同意后再进行登录</div>
      <div class="agree">
        <div class="cb" id="cb" onclick="toggleCb()"></div>
        <span>已阅读并同意 <a class="hl" onclick="toast('查看《用户协议》')">《用户协议》</a>和<a class="hl" onclick="toast('查看《隐私政策》')">《隐私政策》</a></span>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
let agreed=false;
function toggleCb(){agreed=!agreed;document.getElementById('cb').classList.toggle('on',agreed);
  if(agreed)document.getElementById('tip').classList.remove('show');}
function doLogin(){
  const phone=document.getElementById('phone').value.trim();
  const pwd=document.getElementById('pwd').value.trim();
  if(!agreed){document.getElementById('tip').classList.add('show');return;}
  if(!phone){toast('请输入手机号');return;}
  if(!pwd){toast('请输入密码');return;}
  toast('登录成功');
  setTimeout(()=>{location.href='首页.html';},700);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
