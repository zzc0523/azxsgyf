<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>应急预案编制信息采集</title>
<style>
  :root{--blue:#2b5ce6;--blue-d:#1f49c4;--text:#1f2329;--sub:#9aa0ad;--val:#3a4050;--bg:#f4f6fb;--line:#eef0f5;--red:#e5484d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#0e1320}
  .phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
    border:11px solid #232734;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#232734;border-radius:0 0 18px 18px;z-index:30}
  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#111;opacity:.22;z-index:30}

  .header{flex:none;position:relative;background:linear-gradient(180deg,#3f6ef2 0%,#5b86f5 100%);color:#fff;z-index:10}
  .header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent) 90% 40%/200px 130px no-repeat,
               radial-gradient(closest-side,rgba(255,255,255,.10),transparent) 6% 90%/170px 110px no-repeat}
  .statusbar{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;z-index:5}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  .statusbar .icons svg{display:block}
  .navbar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;padding:2px 16px 8px;height:46px}
  .back{width:26px;height:26px;font-size:26px;line-height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:300}
  .navtitle{font-size:17px;font-weight:700;letter-spacing:.5px}
  .capsule{margin-left:auto;display:flex;align-items:center;height:32px;padding:0 13px;border-radius:16px;
    background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .cap-dots{font-size:14px;letter-spacing:2px;line-height:1;padding-bottom:5px;cursor:pointer}
  .cap-line{width:1px;height:15px;background:rgba(255,255,255,.4);margin:0 9px}
  .cap-circ{width:17px;height:17px;border-radius:50%;border:1.6px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cap-circ i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
  .ctx{position:relative;z-index:5;padding:0 16px 12px;font-size:12px;color:rgba(255,255,255,.9)}
  .ctx b{font-weight:600}

  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:14px;margin:14px 16px;padding:6px 16px 14px;box-shadow:0 6px 18px rgba(30,50,110,.06)}
  .card-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:var(--text);padding:14px 0 6px}
  .card-title i{width:3px;height:15px;border-radius:2px;background:var(--blue);display:block}
  .field{padding:13px 0;border-top:1px solid var(--line)}
  .field:first-of-type{border-top:none}
  .flbl{display:flex;align-items:center;color:var(--sub);font-size:13.5px;margin-bottom:10px}
  .flbl .req{color:var(--red);margin-right:3px}

  /* 选项 chips */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:8px 15px;border:1px solid #d8dde8;border-radius:18px;font-size:13.5px;color:var(--val);background:#fff;cursor:pointer;user-select:none;transition:.12s}
  .chip.on{background:rgba(43,92,230,.10);border-color:var(--blue);color:var(--blue);font-weight:600}

  /* 输入 */
  .inp{width:100%;height:40px;border:1px solid #e0e5ef;border-radius:9px;padding:0 12px;font-size:14px;color:var(--val);outline:none;background:#fff;font-family:inherit}
  .inp:focus{border-color:var(--blue)}
  .area{min-height:96px;height:auto;padding:10px 12px;line-height:1.6;resize:none}
  .ctr{display:flex;justify-content:flex-end;margin-top:6px;color:#b9bfcc;font-size:12px}

  /* 定位行 */
  .loc-row{display:flex;gap:10px;align-items:center}
  .loc-row .inp{flex:1}
  .loc-btn{flex:none;height:40px;padding:0 14px;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .loc-btn:disabled{opacity:.6}

  .footer{flex:none;padding:10px 16px 24px;background:var(--bg)}
  .btn-main{width:100%;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(43,92,230,.28)}
  .btn-main:active{background:var(--blue-d)}

  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,28,46,.9);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:74%;text-align:center;line-height:1.6}
  .toast.show{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <div class="header">
    <div class="statusbar"><span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 17 11" width="17" height="11" fill="#fff"><rect x="0" y="7.6" width="3.1" height="3.4" rx="1"/><rect x="4.65" y="5.3" width="3.1" height="5.7" rx="1"/><rect x="9.3" y="3" width="3.1" height="8" rx="1"/><rect x="13.95" y="0.7" width="3.1" height="10.3" rx="1"/></svg>
        <svg viewBox="0 0 15.5 11.2" width="15.5" height="11.2" fill="#fff"><path d="M7.75 11.2 5.95 9.2a2.7 2.7 0 0 1 3.6 0L7.75 11.2Z"/><path d="M7.75 5.85c1.55 0 2.95.6 4 1.65L10.6 8.8a4.1 4.1 0 0 0-5.7 0L3.75 7.5a5.8 2.6 0 0 1 4-1.65Z" opacity=".92"/><path d="M7.75 1.95c2.55 0 4.9 1 6.65 2.65L13.25 5.9A7.95 7.95 0 0 0 7.75 3.7c-2.1 0-3.95.8-5.5 2.2L1.1 4.6A9.55 9.55 0 0 1 7.75 1.95Z" opacity=".82"/></svg>
        <svg viewBox="0 0 25 12" width="25" height="12"><rect x="0.7" y="0.7" width="20.3" height="10.6" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/><rect x="2.4" y="2.4" width="16.9" height="7.2" rx="1.8" fill="#fff"/><path d="M22.6 3.9v4.2c1.05-.35 1.8-1.2 1.8-2.1s-.75-1.75-1.8-2.1Z" fill="#fff" fill-opacity=".5"/></svg>
      </span>
    </div>
    <div class="navbar">
      <div class="back" onclick="history.back()">‹</div>
      <div class="navtitle">应急预案编制信息采集</div>
      <div class="capsule"><span class="cap-dots" onclick="toast('更多')">•••</span><span class="cap-line"></span><span class="cap-circ" onclick="toast('设置')"><i></i></span></div>
    </div>
    <div class="ctx">工单号 <b id="ctxNo">YF2131900</b> · <span id="ctxProj">安全生产应急预案编制</span></div>
  </div>

  <div class="body" id="body"></div>

  <div class="footer"><button class="btn-main" onclick="submitForm()">提交采集</button></div>

  <div class="home-ind"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const FIELDS = [
  {type:'text', name:'应急预案名称', max:50, ph:'请填写应急预案名称（50字以内）', req:true},
  {type:'area', name:'风险场景', max:500, ph:'如：1.XX设备/作业因XX原因导致XX事故；2.XX...', req:true},
  {type:'multi', name:'应急预案种类', opts:['综合应急预案','专项应急预案','现场处置方案'], req:true},
  {type:'area', name:'应急组织架构及人员分工', max:500, ph:'请填写应急组织架构及人员分工（500字以内）', req:true},
  {type:'multi', name:'事故种类', opts:[
    '物体打击','厂（场）内车辆致害','道路（轨道）车辆致害','机械致害','起重致害','触电','淹溺','灼烫','火灾','高处坠落',
    '跌落','坍塌','水害','容器爆炸','管道爆炸','可燃气体爆炸','可燃液体蒸气爆炸','粉尘爆炸','民用爆炸物品爆炸','烟花爆竹爆炸','其他可燃固体爆炸',
    '高温熔融物爆炸','中毒','窒息','滑坡','泄漏','其他'
  ], req:true},
  {type:'area', name:'事故响应程序', max:500, ph:'请填写事故响应程序（500字以内）', req:true},
  {type:'location', name:'当前位置', max:50, ph:'请填写当前位置（50字以内）', req:true},
  {type:'area', name:'应急物资', max:500, ph:'请填写应急物资（500字以内）', req:true},
];

const q = new URLSearchParams(location.search);
document.getElementById('ctxNo').textContent   = q.get('no') || 'YF2131900';
document.getElementById('ctxProj').textContent = q.get('project') || '安全生产应急预案编制';

function render(){
  const fields = FIELDS.map(f=>fieldHTML(f)).join('');
  document.getElementById('body').innerHTML =
    `<div class="card"><div class="card-title"><i></i>应急预案编制信息采集</div>${fields}</div>`;
}

function fieldHTML(f){
  let inner = '';
  if(f.type==='multi'){
    inner = `<div class="chips" data-type="multi">${f.opts.map(o=>`<span class="chip" data-v="${o}">${o}</span>`).join('')}</div>`;
  } else if(f.type==='area'){
    inner = `<textarea class="inp area" maxlength="${f.max}" placeholder="${f.ph||''}" oninput="updCount(this)"></textarea><div class="ctr"><span>0/${f.max}</span></div>`;
  } else if(f.type==='location'){
    inner = `<div class="loc-row"><input class="inp" maxlength="${f.max}" placeholder="${f.ph||''}"><button class="loc-btn" onclick="getLocation(this)">获取定位</button></div>`;
  } else {
    inner = `<input class="inp" type="text" maxlength="${f.max||''}" placeholder="${f.ph||''}"><div class="ctr"></div>`;
  }
  const req = f.req?'<span class="req">*</span>':'';
  return `<div class="field"><div class="flbl">${req}${f.name}</div>${inner}</div>`;
}

function updCount(el){
  const max = el.maxLength || 0;
  const ctr = el.parentElement.querySelector('.ctr span');
  if(ctr && max) ctr.textContent = el.value.length + '/' + max;
}

document.getElementById('body').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(chip && chip.closest('.chips').dataset.type==='multi'){
    chip.classList.toggle('on');
  }
});

function getLocation(btn){
  const input = btn.parentElement.querySelector('input');
  const fill = addr => { input.value = addr; toast('已获取定位'); };
  if(!navigator.geolocation){ fill('福州市台江区（定位不可用·示例）'); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = '定位中…';
  navigator.geolocation.getCurrentPosition(
    pos => { fill(`福州市台江区·经${pos.coords.longitude.toFixed(4)} 纬${pos.coords.latitude.toFixed(4)}`); btn.disabled=false; btn.textContent=old; },
    () => { fill('福州市台江区（定位被拒绝·示例）'); btn.disabled=false; btn.textContent=old; toast('定位失败，已填入示例'); }
  );
}

function submitForm(){
  const miss = [];
  document.querySelectorAll('#body .field').forEach(f=>{
    const lbl = f.querySelector('.flbl').textContent.replace('*','').trim();
    if(f.querySelector('.chips')){ if(!f.querySelector('.chip.on')) miss.push(lbl); }
    else { const el = f.querySelector('input,textarea'); if(!el.value.trim()) miss.push(lbl); }
  });
  if(miss.length){ toast('请完善：'+miss.join('、')); return; }
  try{ localStorage.setItem('entry_应急预案编制信息采集','1'); }catch(e){}
  toast('采集已提交');
  setTimeout(()=>{ history.back(); }, 1100);
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}

render();
</script>
</body>
</html>
