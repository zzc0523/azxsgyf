<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>保单管理 · 保险机构端</title>
<link rel="stylesheet" href="ins-common.css">
<style>
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(20,30,60,.04);}
  /* 查询卡片 */
  .search{padding:18px 20px;margin-bottom:14px;}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .fi{display:flex;align-items:center;}
  .fi label{width:104px;flex:0 0 104px;text-align:right;padding-right:10px;color:#4a5568;white-space:nowrap;}
  .fi input,.fi select{flex:1;min-width:0;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;}
  .fi input:focus,.fi select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .acts{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .btn{height:32px;padding:0 18px;border-radius:4px;border:1px solid #dfe4ed;background:#fff;color:#3a4354;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .btn:hover{border-color:#c7d0de;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);}
  .btn.link{border:none;background:none;color:#7c8aa0;padding:0 4px;}

  /* 表格 */
  .table-wrap{overflow:hidden;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1340px;}
  thead th{background:#f7f9fc;color:#5d6879;font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);color:#2b3242;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody tr:hover{background:#f9fbff;}
  td.op a{color:var(--brand);cursor:pointer;margin-right:10px;}
  td.op a:hover{text-decoration:underline;}
  td.op a.del{color:#f04438;}
  .empty{text-align:center;color:#9aa3b2;padding:38px 0 !important;}
  .st{display:inline-block;padding:2px 11px;border-radius:3px;font-size:12px;}
  .st.active{color:#2fa96b;background:rgba(47,169,107,.12);}
  .st.dead{color:#98a2b3;background:#f2f4f8;}
  .st.pending{color:#3b7cff;background:rgba(59,124,255,.1);}

  /* 分页 */
  .pager{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#5d6879;font-size:13px;flex-wrap:wrap;}
  .pager .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pager .pgbtn{min-width:30px;height:30px;padding:0 8px;border:1px solid #e2e7f0;border-radius:4px;background:#fff;cursor:pointer;color:#3a4354;font-size:13px;}
  .pager .pgbtn:hover:not(:disabled){border-color:#c7d0de;}
  .pager .pgbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .pager .pgbtn:disabled{opacity:.45;cursor:not-allowed;}
  .pager .sizesel{height:30px;border:1px solid #e2e7f0;border-radius:4px;padding:0 8px;color:#3a4354;background:#fff;}
  .pager .go input{width:44px;height:30px;border:1px solid #e2e7f0;border-radius:4px;padding:0 6px;text-align:center;}

  /* ===== 弹窗 ===== */
  .mask{position:fixed;inset:0;background:rgba(15,22,36,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .mask.show{display:flex;}
  .modal{width:min(820px,94vw);background:#fff;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .mhead{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);}
  .mtitle{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;}
  .mtitle::before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px;}
  .mclose{font-size:18px;color:#9aa3b2;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;}
  .mclose:hover{background:#f0f2f7;}
  .mbody{flex:1;overflow:auto;padding:22px 26px 30px;}
  .secttl{font-size:14px;color:#5d6879;margin-bottom:20px;font-weight:600;}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:18px 44px;}
  .fitem{display:flex;align-items:center;}
  .fitem.span2{grid-column:1 / -1;}
  .fitem label{flex:0 0 132px;width:132px;text-align:right;padding-right:12px;font-size:13px;color:#3a4354;line-height:32px;}
  .fitem .req{color:#f04438;margin-right:3px;}
  .fitem input,.fitem select{flex:1;min-width:0;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;}
  .fitem input:focus,.fitem select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .fitem .range{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
  .fitem .range input{flex:1;}
  .fitem .range .sep{color:#8a93a5;flex:0 0 14px;text-align:center;}
  select:disabled,input:disabled{background:#f5f7fa;border-color:#eef1f6;color:#2b3242;-webkit-text-fill-color:#2b3242;cursor:default;}

  /* 可搜索下拉 */
  .combo{position:relative;flex:1;min-width:0;}
  .combo-input{width:100%;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;}
  .combo-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .combo-list{position:absolute;top:37px;left:0;right:0;max-height:220px;overflow:auto;background:#fff;border:1px solid #e2e7f0;border-radius:4px;box-shadow:0 8px 24px rgba(20,30,60,.12);z-index:20;display:none;}
  .combo-list.show{display:block;}
  .combo-opt{padding:8px 12px;font-size:13px;color:#2b3242;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .combo-opt:hover,.combo-opt.hi{background:#f2f6ff;}
  .combo-empty{padding:10px 12px;color:#9aa3b2;font-size:13px;}
  .mfoot{flex:0 0 60px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 26px;border-top:1px solid var(--line);}

  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(20,28,46,.92);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;display:none;}
  .toast.show{display:block;animation:pop .2s;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1}}

  /* ===== 自适应 ===== */
  @media (max-width:1366px){ .search .fields{grid-template-columns:1fr 1fr;} }
  @media (max-width:1024px){
    .search .fields{grid-template-columns:1fr;}
    .form{grid-template-columns:1fr;gap:16px 0;}
    .fi label{width:92px;flex:0 0 92px;}
    .fitem label{flex:0 0 116px;width:116px;}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><i class="logo"><i></i><b></b></i><span>保险机构端</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>

    <div class="page">
      <div class="card search" id="searchCard">
        <div class="fields" id="fields">
          <div class="fi"><label>保单号：</label><input id="q_no" placeholder="请输入" onkeydown="if(event.key==='Enter')doSearch()"></div>
          <div class="fi"><label>投保企业：</label><input id="q_company" placeholder="请输入" onkeydown="if(event.key==='Enter')doSearch()"></div>
          <div class="fi"><label>保单状态：</label><select id="q_status">
            <option value="">请选择</option><option>未生效</option><option>生效中</option><option>已失效</option>
          </select></div>
        </div>
        <div class="acts">
          <button class="btn primary" onclick="doSearch()">查询</button>
          <button class="btn" onclick="doReset()">重置</button>
          <span class="spacer"></span>
          <button class="btn primary" onclick="openAdd()">＋ 新增保单</button>
        </div>
      </div>

      <div class="card table-wrap">
        <table>
          <colgroup>
            <col style="width:56px"><col style="width:180px"><col style="width:230px"><col style="width:96px">
            <col style="width:110px"><col style="width:150px"><col style="width:150px"><col style="width:190px"><col style="width:96px"><col style="width:150px">
          </colgroup>
          <thead><tr>
            <th>序号</th><th>保单号</th><th>投保企业</th><th>投保人数</th>
            <th>保费(元)</th><th>保单开始时间</th><th>保单结束时间</th><th>保单关联项目</th><th>保单状态</th><th>操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<!-- 弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="mhead">
      <div class="mtitle" id="mtitle">保单信息</div>
      <div class="mclose" onclick="closeModal()">✕</div>
    </div>
    <div class="mbody">
      <div class="secttl">保单信息</div>
      <div class="form" id="form">
        <div class="fitem"><label><i class="req">*</i>保单号：</label><input id="f_no" placeholder="请输入保单号"></div>
        <div class="fitem"><label><i class="req">*</i>投保企业：</label>
          <div class="combo" id="f_company_box">
            <input class="combo-input" id="f_company" placeholder="输入关键字模糊检索" autocomplete="off">
            <div class="combo-list" id="f_company_list"></div>
          </div>
        </div>
        <div class="fitem"><label><i class="req">*</i>投保人数：</label><input id="f_people" type="number" min="0" placeholder="请输入"></div>
        <div class="fitem"><label><i class="req">*</i>保费(元)：</label><input id="f_premium" type="number" min="0" placeholder="请输入"></div>
        <div class="fitem"><label><i class="req">*</i>保单开始时间：</label><input id="f_start" type="date"></div>
        <div class="fitem"><label><i class="req">*</i>保单结束时间：</label><input id="f_end" type="date" onchange="updStatus()"></div>
        <div class="fitem span2"><label><i class="req">*</i>保单关联项目：</label>
          <div class="combo" id="f_project_box">
            <input class="combo-input" id="f_project" placeholder="输入关键字模糊检索" autocomplete="off">
            <div class="combo-list" id="f_project_list"></div>
          </div>
        </div>
        <div class="fitem"><label>保单状态：</label><select id="f_status" disabled><option>未生效</option><option>生效中</option><option>已失效</option></select></div>
      </div>
    </div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="ins-common.js"></script>
<script>
/* ===== 数据 ===== */
/* 投保企业：从「投保企业管理」列表(ins_enterprises)读取；项目：从「项目管理」列表(ins_projects)读取 */
const ENTERPRISE_FALLBACK=['华能电力集团有限公司','苏州精工精密制造有限公司','广东明阳新能源股份有限公司','上海陆家嘴置业有限公司','成都天府建筑工程公司','天津港集装箱物流有限公司','武汉光谷生物技术有限公司','西安重型装备制造集团','杭州云栖互联网科技有限公司','青岛远洋船舶工程有限公司','重庆山城食品饮料有限公司','昆明高原旅游开发公司'];
const PROJECT_FALLBACK=['城南万达广场建设项目','滨江路桥梁工程','高新区标准厂房','滨海风电场项目','市中心医院改扩建','轨道交通5号线','生态农业示范园','老旧小区改造','数据中心基建','港口集装箱码头'];
function loadNames(key,fb){ try{const s=localStorage.getItem(key);const a=s?JSON.parse(s):null;if(Array.isArray(a)&&a.length)return a.map(x=>x&&x.name).filter(Boolean);}catch(e){}return fb; }
/* 保单状态判定：开始时间 > 今天 => 未生效；结束时间 < 今天 => 已失效；之间 => 生效中 */
function calcStatus(start,end){
  const t=new Date();t.setHours(0,0,0,0);
  if(end){ const e=new Date(end+'T00:00:00'); if(e<t) return '已失效'; }
  if(start){ const s=new Date(start+'T00:00:00'); if(s>t) return '未生效'; }
  return '生效中';
}
const CO_NAMES=loadNames('ins_enterprises',ENTERPRISE_FALLBACK);
const PR_NAMES=loadNames('ins_projects',PROJECT_FALLBACK);
function fillSel(id,arr,sel){ $('#'+id).innerHTML='<option value="">请选择</option>'+arr.map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join(''); }
/* 可搜索下拉：输入关键字模糊过滤，点击选项回填；支持聚焦展示全部、回车选首项 */
function initCombo(inputId, listId, names){
  const inp=$('#'+inputId), list=$('#'+listId);
  function render(kw){
    kw=(kw||'').trim().toLowerCase();
    const arr=!kw?names:names.filter(n=>n.toLowerCase().includes(kw));
    if(!arr.length){ list.innerHTML='<div class="combo-empty">无匹配结果</div>'; return; }
    list.innerHTML=arr.map(n=>`<div class="combo-opt" data-v="${esc(n)}">${esc(n)}</div>`).join('');
  }
  inp.addEventListener('focus',()=>{ render(''); list.classList.add('show'); });
  inp.addEventListener('input',()=>{ render(inp.value); list.classList.add('show'); });
  list.addEventListener('click',e=>{ const o=e.target.closest('.combo-opt'); if(!o)return; inp.value=o.dataset.v; list.classList.remove('show'); });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); const cur=list.querySelector('.combo-opt.hi')||null; const next=cur?cur.nextElementSibling:list.querySelector('.combo-opt'); if(next&&next.classList.contains('combo-opt')){ if(cur)cur.classList.remove('hi'); next.classList.add('hi'); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); const cur=list.querySelector('.combo-opt.hi'); if(cur&&cur.previousElementSibling){ cur.classList.remove('hi'); cur.previousElementSibling.classList.add('hi'); } }
    else if(e.key==='Enter'){ e.preventDefault(); const hi=list.querySelector('.combo-opt.hi')||list.querySelector('.combo-opt'); if(hi){ inp.value=hi.dataset.v; list.classList.remove('show'); } }
    else if(e.key==='Escape'){ list.classList.remove('show'); }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('#'+inputId+'_box')) list.classList.remove('show'); });
}
function seed(){
  const R=[
    ['PA-2026-000001','华能电力集团有限公司',123,51600,'2026-06-10','2027-06-09','城南万达广场建设项目'],
    ['PA-2026-000002','苏州精工精密制造有限公司',1230,489600,'2026-06-10','2027-06-09','滨江路桥梁工程'],
    ['PA-2026-000003','广东明阳新能源股份有限公司',88,37400,'2026-06-08','2027-06-07','高新区标准厂房'],
    ['PA-2026-000004','上海陆家嘴置业有限公司',210,88200,'2026-06-07','2027-06-06','滨海风电场项目'],
    ['PA-2026-000005','成都天府建筑工程公司',560,235200,'2026-06-06','2025-06-05','市中心医院改扩建'],
    ['PA-2026-000006','天津港集装箱物流有限公司',340,142800,'2026-06-05','2027-06-04','轨道交通5号线'],
    ['PA-2026-000007','武汉光谷生物技术有限公司',980,411600,'2026-06-04','2025-06-03','生态农业示范园'],
    ['PA-2026-000008','西安重型装备制造集团',430,180600,'2026-06-03','2027-06-02','老旧小区改造'],
    ['PA-2026-000009','杭州云栖互联网科技有限公司',1500,630000,'2026-06-02','2027-06-01','数据中心基建'],
    ['PA-2026-000010','青岛远洋船舶工程有限公司',760,319200,'2026-06-01','2025-05-31','港口集装箱码头'],
    ['PA-2026-000011','重庆山城食品饮料有限公司',290,121800,'2026-05-31','2027-05-30','城南万达广场建设项目'],
    ['PA-2026-000012','昆明高原旅游开发公司',610,256200,'2026-12-01','2027-11-30','滨江路桥梁工程']
  ];
  return R.map(([no,company,people,premium,start,end,project])=>({no,company,people,premium,start,end,project,status:calcStatus(start,end)}));
}
let DATA=[];
function load(){try{const s=localStorage.getItem('ins_policies_mgr');if(s)return JSON.parse(s);}catch(e){}return seed();}
function save(){try{localStorage.setItem('ins_policies_mgr',JSON.stringify(DATA));}catch(e){}}
DATA=load();

/* ===== 查询/分页/渲染 ===== */
let state={page:1,size:10,q:{no:'',company:'',status:''}};
function filtered(){
  const {no,company,status}=state.q;
  return DATA.filter(r=>(!no||(r.no||'').toLowerCase().includes(no.toLowerCase()))
    &&(!company||(r.company||'').toLowerCase().includes(company.toLowerCase()))
    &&(!status||r.status===status));
}
function stCls(s){return s==='生效中'?'active':s==='已失效'?'dead':'pending';}
function doSearch(){state.q={no:$('#q_no').value.trim().toLowerCase(),company:$('#q_company').value.trim().toLowerCase(),status:$('#q_status').value};state.page=1;renderTable();}
function doReset(){$('#q_no').value='';$('#q_company').value='';$('#q_status').value='';state.q={no:'',company:'',status:''};state.page=1;renderTable();}
function setSize(v){state.size=+v;state.page=1;renderTable();}
function gotoPage(p){state.page=p;renderTable();}

function renderTable(){
  const rows=filtered();const total=rows.length,size=state.size;
  const pages=Math.max(1,Math.ceil(total/size));
  if(state.page>pages)state.page=pages;
  const start=(state.page-1)*size;const cur=rows.slice(start,start+size);
  $('#tbody').innerHTML=cur.length?cur.map((r,i)=>{
    const idx=DATA.indexOf(r);
    return `<tr>
      <td>${start+i+1}</td>
      <td title="${esc(r.no)}">${esc(r.no)}</td>
      <td title="${esc(r.company)}">${esc(r.company)}</td>
      <td>${r.people!=null&&r.people!==''?r.people:'-'}</td>
      <td>${r.premium!=null&&r.premium!==''?Number(r.premium).toLocaleString():'-'}</td>
      <td>${esc(r.start)}</td>
      <td>${esc(r.end)}</td>
      <td title="${esc(r.project)}">${esc(r.project)}</td>
      <td><span class="st ${stCls(r.status)}">${esc(r.status)}</span></td>
      <td class="op">
        <a onclick="openView(${idx})">查看详情</a>
        <a onclick="openEdit(${idx})">编辑</a>
        <a class="del" onclick="del(${idx})">删除</a>
      </td>
    </tr>`;
  }).join(''):`<tr><td colspan="10" class="empty">暂无数据</td></tr>`;
  renderPager(total,pages,start,cur.length);
}
function renderPager(total,pages,start,cnt){
  let pg='';const cur=state.page;const wS=Math.max(1,cur-2),wE=Math.min(pages,cur+2);
  for(let i=wS;i<=wE;i++)pg+=`<button class="pgbtn ${i===cur?'on':''}" onclick="gotoPage(${i})">${i}</button>`;
  $('#pager').innerHTML=
    `<span>共 ${total} 条</span>`+
    `<span class="right">`+
      `<span>每页</span><select class="sizesel" onchange="setSize(this.value)">${[10,20,50].map(n=>`<option ${n===state.size?'selected':''}>${n}</option>`).join('')}</select><span>条</span>`+
      `<button class="pgbtn" onclick="gotoPage(${Math.max(1,cur-1)})" ${cur===1?'disabled':''}>‹</button>`+
      pg+
      `<button class="pgbtn" onclick="gotoPage(${Math.min(pages,cur+1)})" ${cur===pages?'disabled':''}>›</button>`+
      `<span class="go">前往<input type="number" min="1" max="${pages}" value="${cur}" onchange="gotoPage(Math.min(${pages},Math.max(1,+this.value||1)))">页</span>`+
    `</span>`;
}

/* ===== 弹窗 ===== */
const FORM_IDS=['f_no','f_company','f_people','f_premium','f_start','f_end','f_project'];
function setLocked(lock){ FORM_IDS.forEach(id=>{$('#'+id).disabled=lock;}); }
function setForm(r){
  $('#f_no').value=r.no||''; $('#f_company').value=r.company||'';
  $('#f_people').value=r.people!=null?r.people:''; $('#f_premium').value=r.premium!=null?r.premium:'';
  $('#f_start').value=r.start||''; $('#f_end').value=r.end||'';
  $('#f_project').value=r.project||'';
  updStatus();
}
function updStatus(){ $('#f_status').value=calcStatus($('#f_start').value, $('#f_end').value); }
function closeModal(){$('#mask').classList.remove('show');}
$('#mask').addEventListener('click',e=>{if(e.target===$('#mask'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function openView(i){const r=DATA[i];setForm(r);setLocked(true);$('#mtitle').textContent='查看详情';$('#mfoot').innerHTML='<button class="btn primary" onclick="closeModal()">关闭</button>';$('#mask').classList.add('show');}
function openEdit(i){
  window._editIdx=i;const r=DATA[i];setForm(r);setLocked(false);$('#mtitle').textContent='编辑保单';
  $('#mfoot').innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEdit()">保存修改</button>';
  $('#mask').classList.add('show');
}
function openAdd(){
  setForm({no:'',company:'',people:'',premium:'',start:'',end:'',project:'',status:'生效中'});setLocked(false);
  $('#mtitle').textContent='新增保单';
  $('#mfoot').innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveAdd()">保存</button>';
  $('#mask').classList.add('show');
}
function val(id){return $('#'+id).value.trim();}
function collect(){
  return {no:val('f_no'),company:val('f_company'),people:val('f_people'),premium:val('f_premium'),
    start:val('f_start'),end:val('f_end'),project:$('#f_project').value,status:calcStatus(val('f_start'),val('f_end'))};
}
function validate(d){
  const reqs=[['f_no','保单号'],['f_company','投保企业'],['f_people','投保人数'],['f_premium','保费(元)'],
    ['f_start','保单开始时间'],['f_end','保单结束时间'],['f_project','保单关联项目']];
  for(const [id,label] of reqs){ if(!val(id)){toast('请填写'+label);return false;} }
  if(d.start && d.end && d.start>d.end){ toast('保单结束时间不能早于开始时间'); return false; }
  return true;
}
function saveAdd(){
  const d=collect(); if(!validate(d))return;
  DATA.unshift({no:d.no,company:d.company,people:+d.people,premium:+d.premium,start:d.start,end:d.end,project:d.project,status:d.status});
  save();state.q={no:'',company:'',status:''};$('#q_no').value='';$('#q_company').value='';$('#q_status').value='';state.page=1;
  closeModal();renderTable();toast('保单新增成功');
}
function saveEdit(){
  const d=collect(); if(!validate(d))return;
  const i=window._editIdx;
  DATA[i]={no:d.no,company:d.company,people:+d.people,premium:+d.premium,start:d.start,end:d.end,project:d.project,status:d.status};
  save();closeModal();renderTable();toast('保单修改成功');
}
function del(i){
  if(!confirm('确认删除该保单（'+DATA[i].no+'）？'))return;
  DATA.splice(i,1);save();renderTable();toast('保单已删除');
}

/* ===== 初始化 ===== */
initIns({bread:['保险业务管理','保单管理'], active:'保单管理'});
initCombo('f_company','f_company_list',CO_NAMES);
initCombo('f_project','f_project_list',PR_NAMES);
renderTable();
</script>
</body>
