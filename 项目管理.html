<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>项目管理 · 保险机构端</title>
<link rel="stylesheet" href="ins-common.css">
<style>
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(20,30,60,.04);}
  /* 查询卡片 */
  .search{padding:18px 20px;margin-bottom:14px;}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 22px;}
  .fi{display:flex;align-items:center;gap:8px;min-width:0;}
  .fi label{flex:0 0 110px;text-align:right;padding-right:8px;color:#4a5568;white-space:nowrap;}
  .fi input,.fi select{flex:1;min-width:0;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;}
  .fi input:focus,.fi select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .acts{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .btn{height:32px;padding:0 18px;border-radius:4px;border:1px solid #dfe4ed;background:#fff;color:#3a4354;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;}
  .btn:hover{border-color:#c7d0de;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}

  /* 表格 */
  .table-wrap{overflow:hidden;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1180px;}
  thead th{background:#f7f9fc;color:#5d6879;font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);color:#2b3242;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody tr:hover{background:#f9fbff;}
  td.op a{color:var(--brand);cursor:pointer;margin-right:16px;}
  td.op a:last-child{margin-right:0;}
  td.op a:hover{text-decoration:underline;}
  .empty{text-align:center;color:#9aa3b2;padding:38px 0 !important;}

  /* 分页 */
  .pager{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#5d6879;font-size:13px;flex-wrap:wrap;}
  .pager .pgbtn{min-width:30px;height:30px;padding:0 8px;border:1px solid #e2e7f0;border-radius:4px;background:#fff;cursor:pointer;color:#3a4354;font-size:13px;}
  .pager .pgbtn:hover:not(:disabled){border-color:#c7d0de;}
  .pager .pgbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .pager .pgbtn:disabled{opacity:.45;cursor:not-allowed;}
  .pager .sizesel{height:30px;border:1px solid #e2e7f0;border-radius:4px;padding:0 8px;color:#3a4354;background:#fff;}
  .pager .go input{width:44px;height:30px;border:1px solid #e2e7f0;border-radius:4px;padding:0 6px;text-align:center;}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,22,36,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .mask.show{display:flex;}
  .modal{width:min(780px,94vw);max-height:88vh;background:#fff;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .mhead{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);}
  .mtitle{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;}
  .mtitle::before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px;}
  .mclose{font-size:18px;color:#9aa3b2;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;}
  .mclose:hover{background:#f0f2f7;}
  .mbody{flex:1;overflow:auto;padding:22px 26px 26px;}
  .mfoot{flex:0 0 60px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 26px;border-top:1px solid var(--line);}
  .form{display:grid;grid-template-columns:1fr;gap:14px;}
  .fitem{display:flex;flex-direction:row;align-items:flex-start;gap:0;}
  .fitem label{flex:0 0 188px;width:188px;text-align:right;padding-right:12px;font-size:13px;font-weight:400;color:#3a4354;line-height:32px;}
  .fitem .req{color:#f04438;margin-right:3px;}
  .fitem input,.fitem select,.fitem textarea{flex:1;min-width:0;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;font-family:inherit;}
  .fitem textarea{height:72px;min-height:0;padding:8px 10px;line-height:1.5;resize:vertical;}
  .fitem input:focus,.fitem select:focus,.fitem textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .fitem .unit{flex:0 0 auto;align-self:center;color:#8a93a5;padding-left:8px;white-space:nowrap;}
  .daterow{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .daterow input{flex:1;min-width:0;height:32px;border:1px solid #dfe4ed;border-radius:4px;padding:0 10px;font-size:13px;color:#1f2329;background:#fff;outline:none;}
  .daterow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);}
  .daterow .sep{flex:0 0 auto;color:#8a93a5;white-space:nowrap;}

  @media (max-width:1100px){ .fitem label{flex:0 0 140px;width:140px;} .fields{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:768px){ .fields{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><i class="logo"><i></i><b></b></i><span>保险机构端</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="tabs" id="tabs"></div>

    <div class="page">
      <!-- 查询 -->
      <div class="card search">
        <div class="fields">
          <div class="fi"><label>项目名称</label><input id="q_name" placeholder="请输入项目名称" onkeydown="if(event.key==='Enter')doSearch()"></div>
          <div class="fi"><label>项目类型</label><input id="q_type" placeholder="请输入项目类型" onkeydown="if(event.key==='Enter')doSearch()"></div>
          <div class="fi"><label>工程阶段</label><select id="q_stage"></select></div>
          <div class="fi"><label>安全生产标准化</label><select id="q_std"></select></div>
        </div>
        <div class="acts">
          <button class="btn primary" onclick="doSearch()">查询</button>
          <button class="btn" onclick="doReset()">重置</button>
        </div>
      </div>

      <!-- 操作区 -->
      <div class="toolbar">
        <button class="btn primary" onclick="openAdd()">新增项目</button>
      </div>

      <!-- 列表 -->
      <div class="card table-wrap">
        <table>
          <colgroup>
            <col style="width:60px"><col><col><col><col style="width:96px"><col style="width:96px"><col style="width:120px"><col><col style="width:120px">
          </colgroup>
          <thead><tr>
            <th>序号</th><th>项目名称</th><th>项目类型</th><th>项目详细地址</th>
            <th>工程阶段</th><th>项目负责人</th><th>联系电话</th><th>工程工期</th>
            <th class="op">操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<!-- 新增/编辑弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="mhead">
      <div class="mtitle" id="mtitle">新增项目</div>
      <div class="mclose" onclick="closeModal()">✕</div>
    </div>
    <div class="mbody">
      <div class="form" id="form"></div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="ins-common.js"></script>
<script>
/* ===== 枚举 ===== */
const ENUM = {
  stage:['基础施工','主体施工','装饰安装'],
  std  :['已创建','未创建','已定级','不明'],                 // 安全生产标准化创建情况
  dual :['已创建','未创建','不明'],                          // 双重预防创建情况
  plan :['已创建','未创建','不明'],                          // 应急预案创建备案情况
  eval :['已创建','未创建','不明']                           // 安全现状评价情况
};

/* ===== 字段定义 ===== */
const FIELDS = [
  {k:'name',   label:'项目名称',type:'text',max:100,req:true,ph:'请输入项目名称'},
  {k:'type',   label:'项目类型',type:'text',max:100,req:true,ph:'请输入项目类型'},
  {k:'addr',   label:'项目详细地址',type:'text',max:100,req:true,ph:'请输入项目详细地址'},
  {k:'build',  label:'建设单位',type:'text',max:100,req:false,ph:'请输入建设单位（选填）'},
  {k:'construct',label:'施工单位',type:'text',max:100,req:false,ph:'请输入施工单位（选填）'},
  {k:'stage',  label:'工程阶段',type:'select',opts:ENUM.stage,req:true},
  {k:'period', label:'工程工期',type:'daterange',req:true},
  {k:'leader', label:'项目负责人',type:'text',max:100,req:true,ph:'请输入项目负责人'},
  {k:'leaderPhone',label:'项目负责人联系电话',type:'tel',max:11,req:true,ph:'11位数字'},
  {k:'safe',   label:'项目安全负责人',type:'text',max:100,req:true,ph:'请输入安全负责人'},
  {k:'safePhone',label:'项目安全负责人联系电话',type:'tel',max:11,req:true,ph:'11位数字'},
  {k:'std',    label:'项目安全生产标准化创建情况',type:'select',opts:ENUM.std,req:true},
  {k:'dual',   label:'项目双重预防创建情况',type:'select',opts:ENUM.dual,req:true},
  {k:'plan',   label:'项目应急预案创建备案情况',type:'select',opts:ENUM.plan,req:true},
  {k:'eval',   label:'项目安全现状评价情况',type:'select',opts:ENUM.eval,req:true},
  {k:'intro',  label:'项目介绍',type:'area',max:500,req:true,ph:'500字以内'},
  {k:'equip',  label:'主要设备',type:'area',max:500,req:true,ph:'500字以内'},
  {k:'process',label:'主要工艺',type:'area',max:500,req:true,ph:'500字以内'},
  {k:'product',label:'主要产物',type:'area',max:500,req:true,ph:'500字以内'}
];

function fillSel(sel,arr){
  sel.innerHTML='<option value="">请选择</option>'+arr.map(o=>`<option>${o}</option>`).join('');
}
fillSel($('#q_stage'),ENUM.stage);
fillSel($('#q_std'),ENUM.std);

/* ===== 表单生成 ===== */
function fieldHTML(f){
  let ctrl='';
  if(f.type==='select'){
    ctrl=`<select id="e_${f.k}"><option value="">请选择</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
  } else if(f.type==='area'){
    ctrl=`<textarea id="e_${f.k}" maxlength="${f.max}" placeholder="${f.ph||''}"></textarea>`;
  } else if(f.type==='daterange'){
    ctrl=`<div class="daterow"><input id="e_${f.k}_s" type="date"><span class="sep">至</span><input id="e_${f.k}_e" type="date"></div>`;
  } else if(f.type==='tel'){
    ctrl=`<input id="e_${f.k}" type="tel" inputmode="numeric" maxlength="11" placeholder="${f.ph||''}" oninput="cleanTel(this)">`;
  } else {
    ctrl=`<input id="e_${f.k}" type="text" maxlength="${f.max||''}" placeholder="${f.ph||''}">`;
  }
  const req=f.req?'<i class="req">*</i>':'';
  return `<div class="fitem"><label>${req}${f.label}：</label>${ctrl}</div>`;
}
$('#form').innerHTML=FIELDS.map(fieldHTML).join('');

/* ===== 输入清洗 ===== */
function cleanTel(el){ el.value=el.value.replace(/\D/g,'').slice(0,11); }

/* ===== 演示数据 ===== */
function seed(){
  const R=[
    ['城南万达广场建设项目','商业综合体','江苏省南京市建邺区','大连万达集团','中建八局','主体施工','2025-03-01','2026-12-31','陈志强','13800001111','刘海','13800002222','已定级','已创建','已创建','已创建','大型城市综合体项目','塔吊、施工电梯、脚手架','钢筋混凝土浇筑','商业综合体'],
    ['滨江路桥梁工程','市政桥梁','浙江省杭州市上城区','杭州市城投','中铁大桥局','基础施工','2026-01-10','2027-06-30','赵明','13700003333','孙浩','13700004444','未创建','未创建','未创建','未创建','跨江桥梁施工','打桩机、挂篮、起重机','悬浇施工','桥梁构件'],
    ['高新区标准厂房','工业建筑','四川省成都市高新区','高投集团','华西建设','装饰安装','2024-09-01','2025-08-31','王磊','13600005555','李娜','13600006666','已创建','已创建','已创建','已创建','标准厂房建设','焊机、切割机、升降平台','钢结构安装','工业厂房'],
    ['滨海风电场项目','新能源','福建省莆田市秀屿区','国投电力','中交三航','基础施工','2025-06-15','2027-03-15','周斌','13500007777','吴桐','13500008888','已定级','已创建','已创建','已开展','海上风电建设','风机、吊装船、打桩船','风机基础施工','清洁能源'],
    ['市中心医院改扩建','公共建筑','湖北省武汉市江汉区','武汉城投','中建三局','主体施工','2025-02-20','2026-10-20','郑华','13400009999','冯雪','13400001010','已创建','已创建','已创建','已创建','医院改扩建工程','塔吊、泵车、人货梯','混凝土结构施工','医疗建筑'],
    ['轨道交通5号线','市政交通','广东省深圳市南山区','深圳地铁','中铁建','基础施工','2024-11-01','2028-05-31','黄勇','13300001112','何静','13300002213','已定级','已创建','未创建','已开展','地铁线路施工','盾构机、龙门吊','隧道掘进','轨道交通'],
    ['生态农业示范园','农业工程','山东省潍坊市寒亭区','农发集团','潍坊建工','装饰安装','2025-04-05','2026-02-05','刘洋','13200003314','田苗','13200004415','未创建','未创建','未创建','不明','现代农业园区','温室设备、灌溉系统','无土栽培','农产品'],
    ['老旧小区改造','城市更新','陕西省西安市碑林区','西安住建','陕建集团','装饰安装','2025-07-01','2026-04-30','杨帆','13100005516','段丽','13100006617','已创建','已创建','已创建','已创建','老旧小区提升','升降机、切割机','外墙修缮','住宅小区'],
    ['数据中心基建','信息基建','贵州省贵安新区','云上贵州','中电四公司','主体施工','2025-05-12','2026-11-12','徐磊','13000007718','高鹏','13000008819','已创建','已创建','已创建','已创建','数据中心建设','精密空调、柴油发电机','机电安装','算力设施'],
    ['港口集装箱码头','水运工程','天津市滨海新区','天津港集团','中交一航','基础施工','2024-12-01','2027-01-31','罗成','18900001112','白杨','18900002213','已定级','已创建','已创建','已开展','码头及堆场建设','岸桥、打桩船','沉箱安装','港口设施']
  ];
  return R.map(r=>({name:r[0],type:r[1],addr:r[2],build:r[3],construct:r[4],stage:r[5],
    period:r[6]+' 至 '+r[7],leader:r[8],leaderPhone:r[9],safe:r[10],safePhone:r[11],
    std:r[12],dual:r[13],plan:r[14],eval:r[15],intro:r[16],equip:r[17],process:r[18],product:r[19]}));
}
let DATA;
try{ const s=localStorage.getItem('ins_projects'); DATA=s?JSON.parse(s):null; }catch(e){ DATA=null; }
if(!Array.isArray(DATA)||!DATA.length) DATA=seed();
function save(){ try{ localStorage.setItem('ins_projects', JSON.stringify(DATA)); }catch(e){} }
save();

/* ===== 列表 / 查询 / 分页 ===== */
let state={page:1,size:10,q:{name:'',type:'',stage:'',std:''}};
function filtered(){
  const {name,type,stage,std}=state.q;
  return DATA.filter(r=>(!name||r.name.toLowerCase().includes(name))
    &&(!type||r.type.toLowerCase().includes(type))
    &&(!stage||r.stage===stage)
    &&(!std||r.std===std));
}
function doSearch(){
  state.q={name:$('#q_name').value.trim().toLowerCase(),type:$('#q_type').value.trim().toLowerCase(),
    stage:$('#q_stage').value,std:$('#q_std').value};
  state.page=1;renderTable();
}
function doReset(){
  $('#q_name').value='';$('#q_type').value='';$('#q_stage').value='';$('#q_std').value='';
  state.q={name:'',type:'',stage:'',std:''};state.page=1;renderTable();
}
function setSize(v){state.size=+v;state.page=1;renderTable();}
function gotoPage(p){state.page=p;renderTable();}

function renderTable(){
  const rows=filtered(),total=rows.length,size=state.size;
  const pages=Math.max(1,Math.ceil(total/size));
  if(state.page>pages)state.page=pages;
  const start=(state.page-1)*size,cur=rows.slice(start,start+size);
  $('#tbody').innerHTML=cur.length?cur.map((r,i)=>{
    const idx=DATA.indexOf(r);
    return `<tr>
      <td>${start+i+1}</td>
      <td title="${esc(r.name)}">${esc(r.name)}</td>
      <td title="${esc(r.type)}">${esc(r.type)}</td>
      <td title="${esc(r.addr)}">${esc(r.addr)}</td>
      <td>${esc(r.stage)}</td>
      <td title="${esc(r.leader)}">${esc(r.leader)}</td>
      <td>${esc(r.leaderPhone)}</td>
      <td title="${esc(r.period)}">${esc(r.period)}</td>
      <td class="op"><a onclick="openEdit(${idx})">编辑</a><a onclick="del(${idx})">删除</a></td>
    </tr>`;
  }).join(''):`<tr><td colspan="9" class="empty">暂无数据</td></tr>`;
  renderPager(total,pages);
}
function renderPager(total,pages){
  const cur=state.page;
  let wS=Math.max(1,cur-2),wE=Math.min(pages,wS+4);wS=Math.max(1,wE-4);
  let pg='';for(let i=wS;i<=wE;i++)pg+=`<button class="pgbtn ${i===cur?'on':''}" onclick="gotoPage(${i})">${i}</button>`;
  $('#pager').innerHTML=
    `<span>共 ${total} 条</span>`+
    `<select class="sizesel" onchange="setSize(this.value)">${[10,20,50].map(n=>`<option ${n===state.size?'selected':''}>${n}条/页</option>`).join('')}</select>`+
    `<button class="pgbtn" onclick="gotoPage(${Math.max(1,cur-1)})" ${cur===1?'disabled':''}>‹</button>`+
    pg+
    `<button class="pgbtn" onclick="gotoPage(${Math.min(pages,cur+1)})" ${cur===pages?'disabled':''}>›</button>`+
    `<span class="go">前往<input type="number" min="1" max="${pages}" value="${cur}" onchange="gotoPage(Math.min(${pages},Math.max(1,+this.value||1)))">页</span>`;
}

/* ===== 新增 / 编辑弹窗 ===== */
let editIdx=-1;
function closeModal(){$('#mask').classList.remove('show');}
$('#mask').addEventListener('click',e=>{if(e.target===$('#mask'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function setForm(r){
  FIELDS.forEach(f=>{
    if(f.type==='daterange'){
      const p=r?(r[f.k]||'').split(' 至 '):['',''];
      $('#e_'+f.k+'_s').value=p[0]||'';
      $('#e_'+f.k+'_e').value=p[1]||'';
      return;
    }
    const el=$('#e_'+f.k); el.value=r?(r[f.k]||''):'';
  });
}
function openAdd(){
  editIdx=-1;
  $('#mtitle').textContent='新增项目';
  setForm(null);
  $('#mask').classList.add('show');$('#e_name').focus();
}
function openEdit(i){
  const r=DATA[i];editIdx=i;
  $('#mtitle').textContent='编辑项目';
  setForm(r);
  $('#mask').classList.add('show');
}
function saveForm(){
  const rec={};
  for(const f of FIELDS){
    if(f.type==='daterange'){
      const s=$('#e_'+f.k+'_s').value, e=$('#e_'+f.k+'_e').value;
      if(f.req && (!s||!e)){ toast('请选择'+f.label); return; }
      rec[f.k]=s+' 至 '+e; continue;
    }
    const el=$('#e_'+f.k);
    let v=el.value.trim();
    if(f.type==='select'){
      if(!v){ if(f.req){ toast('请选择'+f.label); return; } rec[f.k]=''; continue; }
      rec[f.k]=v; continue;
    }
    if(f.req && !v){ toast('请填写'+f.label); return; }
    if(f.type==='tel' && !/^\d{11}$/.test(v)){ toast(f.label+'需为11位数字'); return; }
    rec[f.k]=v;
  }
  if(editIdx<0){ DATA.unshift(rec); toast('项目新增成功'); }
  else{ DATA[editIdx]=rec; toast('项目信息已更新'); }
  closeModal();renderTable();save();
}

/* ===== 删除 ===== */
function del(i){
  if(!confirm('确认删除项目「'+DATA[i].name+'」？')) return;
  DATA.splice(i,1);save();renderTable();toast('已删除');
}

/* ===== 初始化 ===== */
initIns({bread:['项目管理'],active:'项目管理'});
renderTable();
</script>
</body>
