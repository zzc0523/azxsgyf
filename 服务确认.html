<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>服务确认</title>
<style>
  :root{--blue:#2b5ce6;--blue-d:#1f49c4;--text:#1f2329;--sub:#9aa0ad;--val:#3a4050;--bg:#f3f6fc;--line:#eef0f5;--red:#e5484d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#0e1320}
  .phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
    border:11px solid #232734;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#232734;border-radius:0 0 18px 18px;z-index:20}
  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#111;opacity:.22;z-index:30}

  .header{flex:none;position:relative;background:linear-gradient(180deg,#3f6ef2 0%,#5b86f5 100%);color:#fff;z-index:10}
  .header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent) 90% 40%/200px 130px no-repeat,
               radial-gradient(closest-side,rgba(255,255,255,.10),transparent) 6% 90%/170px 110px no-repeat}
  .statusbar{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;z-index:5}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  .statusbar .icons svg{display:block}
  .navbar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;padding:2px 16px 12px;height:48px}
  .back{width:26px;height:26px;font-size:26px;line-height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:300}
  .navtitle{flex:1;font-size:17px;font-weight:700;letter-spacing:.5px}
  .nav-actions{display:flex;align-items:center;gap:16px}
  .nav-actions .ico{display:flex;align-items:center;justify-content:center;cursor:pointer}

  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body::-webkit-scrollbar{display:none}

  /* 分节标题 */
  .sec-label{display:flex;align-items:center;color:var(--text);font-size:14.5px;font-weight:700;padding:16px 18px 10px}
  .sec-label i{color:var(--red);font-style:normal;margin-right:3px;line-height:1}

  /* 签名板 */
  .signwrap{padding:0 18px}
  .sign{position:relative;height:152px;background:#fff;border:1px dashed #ccd2e0;border-radius:10px;overflow:hidden}
  .sign canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .sign .ph{position:absolute;left:14px;top:14px;color:#c2c8d4;font-size:12.5px;pointer-events:none}
  .sign .expand{position:absolute;top:8px;right:8px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
  .clear{display:none;margin:10px 0 0 auto;height:34px;padding:0 16px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;font-size:13px;cursor:pointer}
  .signwrap.has .clear{display:block}
  .signwrap.has .ph{display:none}
  .sign.full{position:fixed;inset:0;height:auto;border-radius:0;border-style:solid;border-color:#e2e6ef;z-index:60}
  .sign.full .ph{left:24px;top:24px}

  /* 评价 */
  .sub{color:var(--text);font-size:14px;font-weight:600;padding:8px 18px 12px}
  .rate-row{display:flex;align-items:center;padding:0 18px 12px}
  .rk{width:78px;flex:none;color:#8b91a0;font-size:13.5px}
  .stars{display:flex;gap:8px}
  .stars svg{display:block;cursor:pointer}
  .suggest-lb{padding:2px 18px 8px;color:#8b91a0;font-size:13.5px}
  .panel{padding:0 18px}
  .ta{display:block;width:100%;min-height:104px;border:1px solid #e0e5ef;border-radius:10px;padding:12px;font-size:13.5px;color:var(--val);outline:none;resize:none;font-family:inherit;background:#fff;line-height:1.6}
  .ta::placeholder{color:#c2c8d4}

  .footer{flex:none;padding:10px 16px 26px;background:var(--bg)}
  .btn-main{width:100%;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(43,92,230,.28)}
  .btn-main:active{background:var(--blue-d)}

  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,28,46,.9);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:74%;text-align:center;line-height:1.6}
  .toast.show{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="header">
    <div class="statusbar"><span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 17 11" width="17" height="11" fill="#fff"><rect x="0" y="7.6" width="3.1" height="3.4" rx="1"/><rect x="4.65" y="5.3" width="3.1" height="5.7" rx="1"/><rect x="9.3" y="3" width="3.1" height="8" rx="1"/><rect x="13.95" y="0.7" width="3.1" height="10.3" rx="1"/></svg>
        <svg viewBox="0 0 15.5 11.2" width="15.5" height="11.2" fill="#fff"><path d="M7.75 11.2 5.95 9.2a2.7 2.7 0 0 1 3.6 0L7.75 11.2Z"/><path d="M7.75 5.85c1.55 0 2.95.6 4 1.65L10.6 8.8a4.1 4.1 0 0 0-5.7 0L3.75 7.5a5.8 2.6 0 0 1 4-1.65Z" opacity=".92"/><path d="M7.75 1.95c2.55 0 4.9 1 6.65 2.65L13.25 5.9A7.95 7.95 0 0 0 7.75 3.7c-2.1 0-3.95.8-5.5 2.2L1.1 4.6A9.55 9.55 0 0 1 7.75 1.95Z" opacity=".82"/></svg>
        <svg viewBox="0 0 25 12" width="25" height="12"><rect x="0.7" y="0.7" width="20.3" height="10.6" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/><rect x="2.4" y="2.4" width="16.9" height="7.2" rx="1.8" fill="#fff"/><path d="M22.6 3.9v4.2c1.05-.35 1.8-1.2 1.8-2.1s-.75-1.75-1.8-2.1Z" fill="#fff" fill-opacity=".5"/></svg>
      </span>
    </div>
    <div class="navbar">
      <div class="back" onclick="history.back()">‹</div>
      <div class="navtitle">服务确认</div>
      <div class="nav-actions">
        <span class="ico" title="更多"><svg width="20" height="20" viewBox="0 0 20 20" fill="#fff"><circle cx="4" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/></svg></span>
        <span class="ico" title="信息"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="10" cy="10" r="7.2"/><path d="M7.4 10.2l1.8 1.8 3.6-4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="sec-label"><i>*</i>服务人员</div>
    <div class="signwrap" data-signwrap>
      <div class="sign">
        <canvas></canvas>
        <span class="ph">请在下方空白处签字</span>
        <span class="expand" title="全屏签字"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#aab0bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M2 2l5 5M10 14h4v-4M14 14L9 9"/></svg></span>
      </div>
      <button class="clear">清除重写</button>
    </div>

    <div class="sec-label"><i>*</i>现场负责人</div>
    <div class="sub">1、服务评价</div>
    <div class="rate-row"><span class="rk">服务态度：</span><span class="stars" data-rate data-val="5"></span></div>
    <div class="rate-row"><span class="rk">专业水平：</span><span class="stars" data-rate data-val="0"></span></div>
    <div class="rate-row"><span class="rk">沟通能力：</span><span class="stars" data-rate data-val="0"></span></div>
    <div class="suggest-lb">服务建议：</div>
    <div class="panel"><textarea class="ta" placeholder="请输入内容"></textarea></div>

    <div class="sub" style="padding-top:18px">2、服务确认签字:</div>
    <div class="signwrap" data-signwrap>
      <div class="sign">
        <canvas></canvas>
        <span class="ph">请在下方空白处签字</span>
        <span class="expand" title="全屏签字"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#aab0bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M2 2l5 5M10 14h4v-4M14 14L9 9"/></svg></span>
      </div>
      <button class="clear">清除重写</button>
    </div>

    <div class="sec-label" style="padding-top:20px">陪同人员(若有)</div>
    <div class="signwrap" data-signwrap>
      <div class="sign">
        <canvas></canvas>
        <span class="ph">请在下方空白处签字</span>
        <span class="expand" title="全屏签字"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#aab0bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M2 2l5 5M10 14h4v-4M14 14L9 9"/></svg></span>
      </div>
      <button class="clear">清除重写</button>
    </div>
  </div>

  <div class="footer"><button class="btn-main" onclick="submitConfirm()">确认提交</button></div>
  <div class="home-ind"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ===== 星级评分 ===== */
const STAR_ON = '#ff9f0a', STAR_OFF = '#dcdfe6';
function starSVG(on){
  return `<svg viewBox="0 0 24 24" width="21" height="21" fill="${on?STAR_ON:STAR_OFF}"><path d="M12 2.6l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.68l-5.88 3.09 1.12-6.55-4.76-4.64 6.58-.96z"/></svg>`;
}
function renderStars(box){
  const v = +box.dataset.val;
  box.innerHTML = [1,2,3,4,5].map(n=>starSVG(n<=v)).join('');
}
function setupStars(){
  document.querySelectorAll('[data-rate]').forEach(box=>{
    renderStars(box);
    box.addEventListener('click', e=>{
      const svg = e.target.closest('svg'); if(!svg) return;
      box.dataset.val = [...box.children].indexOf(svg) + 1;
      renderStars(box);
    });
  });
}

/* ===== 手写签名板 ===== */
function setupSign(wrap){
  const sign = wrap.querySelector('.sign');
  const canvas = wrap.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let strokes = [], cur = null, drawing = false;

  function pos(e){
    const r = sign.getBoundingClientRect();
    return { x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height };
  }
  function draw(){
    const r = sign.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);
    ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='#1f2329'; ctx.fillStyle='#1f2329';
    strokes.forEach(s=>{
      if(s.length===1){ ctx.beginPath(); ctx.arc(s[0].x*r.width, s[0].y*r.height, 1.3, 0, Math.PI*2); ctx.fill(); return; }
      ctx.beginPath();
      s.forEach((p,i)=>{ const x=p.x*r.width, y=p.y*r.height; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
    });
  }
  function hasInk(){ return strokes.some(s=>s.length>0); }

  canvas.addEventListener('pointerdown', e=>{
    drawing = true; canvas.setPointerCapture(e.pointerId);
    cur = [pos(e)]; strokes.push(cur);
    wrap.classList.add('has'); draw();
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return; cur.push(pos(e)); draw();
  });
  const stop = ()=>{ drawing=false; cur=null; if(!hasInk()) wrap.classList.remove('has'); };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  wrap.querySelector('.clear').addEventListener('click', ()=>{
    strokes=[]; draw(); wrap.classList.remove('has');
  });
  const expand = sign.querySelector('.expand');
  expand.addEventListener('pointerdown', e=>e.stopPropagation());
  expand.addEventListener('click', e=>{
    e.stopPropagation();
    sign.classList.toggle('full');
    requestAnimationFrame(draw);
  });

  window.addEventListener('resize', draw);
  draw();
}

/* ===== 提交 ===== */
function submitConfirm(){
  const ratings = [...document.querySelectorAll('[data-rate]')].map(b=>+b.dataset.val);
  const signed = [...document.querySelectorAll('[data-signwrap]')].filter(w=>w.classList.contains('has')).length;
  if(signed < 2){ toast('请完成服务人员与现场负责人签字'); return; }
  if(ratings.some(v=>v===0)){ toast('请完成全部服务评价'); return; }
  toast('服务确认已提交');
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }

/* ===== 初始化 ===== */
setupStars();
document.querySelectorAll('[data-signwrap]').forEach(setupSign);
</script>
</body>
</html>
