<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>待执行 · 工单详情</title>
<style>
  :root{--blue:#2b5ce6;--blue-d:#1f49c4;--text:#1f2329;--lbl:#757c8a;--val:#262b33;--line:#f1f3f7;--bg:#f4f5f7;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#0e1320}
  .phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
    border:11px solid #232734;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#232734;border-radius:0 0 18px 18px;z-index:20}
  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#111;opacity:.22;z-index:30}

  /* ===== 头部（蓝 / 逾期红） ===== */
  .header{flex:none;position:relative;overflow:hidden;padding-bottom:18px;color:#fff;
    background:linear-gradient(180deg,#3f6ef2 0%,#5b86f5 100%)}
  .header.overdue{background:linear-gradient(180deg,#f46368 0%,#e83b41 100%)}
  .watermark{position:absolute;right:-16px;top:6px;width:190px;height:190px;opacity:.12;pointer-events:none}
  .header .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,.20),transparent) 88% 24%/230px 160px no-repeat,
               radial-gradient(closest-side,rgba(255,255,255,.10),transparent) 4% 96%/180px 120px no-repeat}

  .statusbar{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;z-index:5}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  .statusbar .icons svg{display:block}

  .navbar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;padding:2px 16px 4px;height:44px}
  .back{width:26px;height:26px;font-size:26px;line-height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:300}
  .navtitle{font-size:17px;font-weight:600;letter-spacing:.4px}
  .capsule{margin-left:auto;display:flex;align-items:center;height:32px;padding:0 13px;border-radius:16px;
    background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .cap-dots{font-size:14px;letter-spacing:2px;line-height:1;padding-bottom:5px;cursor:pointer}
  .cap-line{width:1px;height:15px;background:rgba(255,255,255,.4);margin:0 9px}
  .cap-circ{width:17px;height:17px;border-radius:50%;border:1.6px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cap-circ i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}

  .hero{position:relative;z-index:5;padding:6px 16px 0}
  .hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px;line-height:1.25}
  .hero p{margin:8px 0 0;font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.5}

  /* ===== 详情卡片 ===== */
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:12px;margin:14px 16px;padding:2px 16px;box-shadow:0 4px 14px rgba(30,50,110,.05)}
  .row{display:flex;align-items:center;padding:14px 0;font-size:14px;border-bottom:1px solid var(--line);line-height:1.5}
  .row:last-child{border-bottom:none}
  .lbl{color:var(--lbl);flex:none}
  .val{color:var(--val);display:flex;align-items:center;gap:5px;min-width:0;word-break:break-all}
  .val.link{color:var(--blue)}
  .val .ico{flex:none;display:block}

  /* ===== 底部操作 ===== */
  .footer{flex:none;padding:10px 16px 24px;background:var(--bg)}
  .btn-main{width:100%;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(43,92,230,.28);transition:.15s}
  .btn-main:active{background:var(--blue-d);transform:translateY(1px)}

  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,28,46,.9);color:#fff;
    padding:12px 18px;border-radius:10px;font-size:14px;z-index:40;display:none;max-width:72%;text-align:center;line-height:1.6}
  .toast.show{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <div class="header" id="header">
    <svg class="watermark" viewBox="0 0 200 200" fill="none">
      <path d="M100 12 182 54v74l-82 60-82-60V54z" fill="#fff"/>
      <circle cx="100" cy="86" r="24" fill="#fff" opacity=".55"/>
      <path d="M56 140c10-20 26-30 44-30s34 10 44 30z" fill="#fff" opacity=".55"/>
    </svg>
    <div class="glow"></div>

    <div class="statusbar"><span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 17 11" width="17" height="11" fill="#fff">
          <rect x="0" y="7.6" width="3.1" height="3.4" rx="1"/>
          <rect x="4.65" y="5.3" width="3.1" height="5.7" rx="1"/>
          <rect x="9.3" y="3" width="3.1" height="8" rx="1"/>
          <rect x="13.95" y="0.7" width="3.1" height="10.3" rx="1"/>
        </svg>
        <svg viewBox="0 0 15.5 11.2" width="15.5" height="11.2" fill="#fff">
          <path d="M7.75 11.2 5.95 9.2a2.7 2.7 0 0 1 3.6 0L7.75 11.2Z"/>
          <path d="M7.75 5.85c1.55 0 2.95.6 4 1.65L10.6 8.8a4.1 4.1 0 0 0-5.7 0L3.75 7.5a5.8 5.8 0 0 1 4-1.65Z" opacity=".92"/>
          <path d="M7.75 1.95c2.55 0 4.9 1 6.65 2.65L13.25 5.9A7.95 7.95 0 0 0 7.75 3.7c-2.1 0-3.95.8-5.5 2.2L1.1 4.6A9.55 9.55 0 0 1 7.75 1.95Z" opacity=".82"/>
        </svg>
        <svg viewBox="0 0 25 12" width="25" height="12">
          <rect x="0.7" y="0.7" width="20.3" height="10.6" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
          <rect x="2.4" y="2.4" width="16.9" height="7.2" rx="1.8" fill="#fff"/>
          <path d="M22.6 3.9v4.2c1.05-.35 1.8-1.2 1.8-2.1s-.75-1.75-1.8-2.1Z" fill="#fff" fill-opacity=".5"/>
        </svg>
      </span>
    </div>

    <div class="navbar">
      <div class="back" onclick="history.back()">‹</div>
      <div class="navtitle" id="navTitle">YF2131900</div>
      <div class="capsule">
        <span class="cap-dots" onclick="toast('更多')">•••</span>
        <span class="cap-line"></span>
        <span class="cap-circ" onclick="toast('设置')"><i></i></span>
      </div>
    </div>

    <div class="hero">
      <h1 id="heroTitle">待执行</h1>
      <p>确认后请准时前往计划地点进行事故预防服务</p>
    </div>
  </div>

  <div class="body">
    <div class="card" id="card"></div>
  </div>

  <div class="footer">
    <button class="btn-main" onclick="checkIn()">现场签到</button>
  </div>

  <div class="home-ind"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* 从列表页带入的参数 */
const q = new URLSearchParams(location.search);
const orderNo  = q.get('no') || 'YF2131900';
const project  = q.get('project') || '安全风险辨识、评估、评价';
const overdue  = q.get('overdue') === '1';

const PIN = '<svg class="ico" viewBox="0 0 12 15" width="11" height="14"><path d="M6 0a6 6 0 0 0-6 6c0 4.2 6 9 6 9s6-4.8 6-9A6 6 0 0 0 6 0Zm0 8.2A2.2 2.2 0 1 1 6 3.8a2.2 2.2 0 0 1 0 4.4Z" fill="#2b5ce6"/></svg>';
const TEL = '<svg class="ico" viewBox="0 0 15 15" width="13" height="13"><path d="M3.1 1C2.5 1 1.9 1.6 1.9 2.3c0 6.5 4.3 10.8 10.8 10.8.7 0 1.3-.6 1.3-1.2v-1.9c0-.5-.3-.9-.7-1l-2.1-.7c-.4-.1-.8 0-1 .3l-.6.8a8.9 8.9 0 0 1-3.3-3.3l.8-.6c.3-.2.4-.6.3-1l-.7-2.1c-.1-.5-.5-.7-1-.7H3.1Z" fill="#2b5ce6"/></svg>';

const ROWS = [
  { l:'企业名称：',     v:'福州无比欢信息科技有限公司' },
  { l:'服务项目：',     v:project },
  { l:'计划服务日期：', v:'2025.01.01-2025.01.05' },
  { l:'计划服务地点：', v:'福州马尾区海峡广场A座', ico:PIN },
  { l:'保单号：',       v:'SDA2141289114' },
  { l:'承包机构：',     v:'大地保险' },
  { l:'联系人：',       v:'张三' },
  { l:'联系电话：',     v:'18000000000', ico:TEL, link:true, tel:'18000000000' },
  { l:'备注：',         v:'－' }
];

/* 逾期状态：头部转红 + 标题追加“· 逾期” */
if(overdue){
  document.getElementById('header').classList.add('overdue');
  document.getElementById('heroTitle').textContent = '待执行 · 逾期';
}
document.getElementById('navTitle').textContent = orderNo;
document.title = orderNo + ' · 待执行';

document.getElementById('card').innerHTML = ROWS.map(r=>`
  <div class="row">
    <span class="lbl">${r.l}</span>
    <span class="val ${r.link?'link':''}" ${r.tel?`onclick="call()"`:''}>${r.v}${r.ico||''}</span>
  </div>`).join('');

function checkIn(){
  location.href = '打卡签到.html?no=' + encodeURIComponent(orderNo)
                + '&project=' + encodeURIComponent(project);
}
function call(){ toast('呼叫 18000000000'); }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
</script>
</body>
</html>
