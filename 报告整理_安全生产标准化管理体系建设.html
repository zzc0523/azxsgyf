<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>报告整理 · 安全生产标准化管理体系建设</title>
<style>
  :root{--blue:#2b5ce6;--blue-d:#1f49c4;--text:#1f2329;--sub:#9aa0ad;--val:#3a4050;--bg:#f4f6fb;--line:#eef0f5;--red:#e5484d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#0e1320}
  .phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
    border:11px solid #232734;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#232734;border-radius:0 0 18px 18px;z-index:20}
  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#111;opacity:.22;z-index:30}

  .header{flex:none;position:relative;background:linear-gradient(180deg,#3f6ef2 0%,#5b86f5 100%);color:#fff;z-index:10}
  .header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent) 90% 40%/200px 130px no-repeat,
               radial-gradient(closest-side,rgba(255,255,255,.10),transparent) 6% 90%/170px 110px no-repeat}
  .statusbar{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;z-index:5}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  .statusbar .icons svg{display:block}
  .navbar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;padding:2px 16px 4px;height:46px}
  .back{width:26px;height:26px;font-size:26px;line-height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:300}
  .navtitle{font-size:17px;font-weight:700;letter-spacing:.5px}

  .body{flex:1;overflow-y:auto}
  .body::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:14px;margin:0 16px;padding:14px 16px;box-shadow:0 6px 18px rgba(30,50,110,.06)}
  .card.first{margin-top:0}
  .sec-title{font-size:13px;font-weight:600;color:#8b91a0;padding:16px 16px 8px}
  .sec{font-size:15px;font-weight:700;color:var(--text);padding:18px 16px 8px;display:flex;align-items:center}
  .sec::before{content:"";width:3px;height:15px;background:var(--blue);border-radius:2px;margin-right:8px}

  .info .frow{display:flex;padding:9px 0;border:none;font-size:13.5px;line-height:1.5}
  .info .k{color:#8b91a0;flex:none}
  .info .v{color:#1f2329;font-weight:600;flex:1;min-width:0;word-break:break-word}


  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .seg{display:inline-flex;background:#f1f3f8;border-radius:20px;padding:3px;margin-bottom:12px}
  .seg .chip{border:none;background:transparent;color:#5b6472;padding:7px 16px;border-radius:18px;font-size:13px;cursor:pointer}
  .seg .chip.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 2px 6px rgba(30,50,110,.10)}
  .chip{font-size:13px}

  .pane{display:none}
  .pane.show{display:block}
  .hide{display:none!important}

  /* 统一上传样式（对齐其他 报告整理 页） */
  .flbl{display:flex;align-items:center;color:var(--sub);font-size:13.5px;margin-bottom:10px}
  .flbl .note{margin-left:auto;color:#b9bfcc;font-size:12px;font-weight:400}
  .upload{display:flex;align-items:center;gap:10px}
  .up-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600}
  .up-btn svg{display:block}
  .fname{color:#6b7280;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docs{display:flex;flex-direction:column;gap:10px}
  .doclist{display:flex;flex-direction:column;gap:7px}
  .docitem{display:flex;align-items:center;gap:8px;background:#f4f6fb;border-radius:8px;padding:9px 11px}
  .docitem .docname{font-size:12.5px;color:#3a4050;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docitem .docx{width:18px;height:18px;border-radius:50%;background:#c8cedb;color:#fff;font-size:13px;text-align:center;line-height:17px;cursor:pointer;flex:none}
  .ustat{font-size:13px;font-weight:600}
  .ustat.ok{color:#2f9e6b}
  .ustat.no{color:var(--red)}

  .ta{width:100%;min-height:120px;border:1px solid #e6e9f0;border-radius:8px;padding:10px;font-size:13.5px;outline:none;resize:vertical;font-family:inherit;box-sizing:border-box;color:var(--val);line-height:1.7}
  .aibtn{margin-top:10px;width:100%;height:38px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .aibtn:active{opacity:.85}
  .smbtn{margin-top:8px;width:100%;height:38px;border:1px solid var(--blue);border-radius:8px;background:#fff;color:var(--blue);font-size:13px;font-weight:500;cursor:pointer}

  .rstat{margin-top:10px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .rstat b{color:#2f9e6b;font-weight:600}

  .footer{flex:none;padding:10px 16px 24px;background:var(--bg);display:flex;gap:10px}
  .btn-main{flex:1;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(43,92,230,.28)}
  .btn-main:active{background:var(--blue-d)}
  .btn-draft{flex:none;height:46px;padding:0 22px;border-radius:10px;background:#fff;border:1px solid var(--blue);color:var(--blue);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-draft:active{background:#eef2fc}

  /* 报告预览 */
  .preview{position:absolute;inset:0;background:#f4f6fb;z-index:70;display:none;flex-direction:column}
  .preview.show{display:flex}
  .preview-head{flex:none;padding:30px 16px 14px;background:linear-gradient(180deg,#3f6ef2,#5b86f5);color:#fff}
  .preview-title{font-size:17px;font-weight:700}
  .preview-sub{font-size:12px;opacity:.92;margin-top:5px;word-break:break-word}
  .preview-body{flex:1;overflow-y:auto;padding:16px}
  .preview-body::-webkit-scrollbar{display:none}
  .pv-card{background:#fff;border-radius:14px;padding:6px 16px 14px;box-shadow:0 6px 18px rgba(30,50,110,.06)}
  .pv-sec{font-size:16px;font-weight:700;color:var(--blue);margin:0 0 10px}
  .pv-row{padding:10px 0;border-bottom:1px dashed #e6e9f0;font-size:13.5px;line-height:1.7}
  .pv-row:last-child{border-bottom:none}
  .pv-k{color:#8b91a0;font-size:12.5px;margin-bottom:3px}
  .pv-v{color:#1f2329;word-break:break-word}
  .preview-foot{flex:none;display:flex;gap:12px;padding:10px 16px 24px;background:var(--bg)}
  .preview-foot button{flex:1 1 0;min-width:0;height:46px;margin:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .preview-foot .btn-main{box-shadow:0 6px 16px rgba(43,92,230,.28)}
  .preview-foot .btn-ghost{border:1px solid var(--blue);background:#fff;color:var(--blue)}
  .preview-foot .btn-ghost:active{background:#eef2fc}

  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,28,46,.9);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;display:none;max-width:74%;text-align:center;line-height:1.6}
  .toast.show{display:block}
  /* 现场照片模块（自包含，避免与各页已有 .card/.frow 等类名冲突） */
  .phsec{font-size:15px;font-weight:700;color:#1f2329;padding:18px 16px 8px;display:flex;align-items:center}
  .phsec::before{content:"";width:3px;height:15px;background:#2b5ce6;border-radius:2px;margin-right:8px}
  .phcard{background:#fff;border-radius:14px;margin:0 16px;padding:4px 16px;box-shadow:0 6px 18px rgba(30,50,110,.06)}
  .phlrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;cursor:pointer;border-radius:8px;transition:background .12s}
  .phlrow:active{background:#f7f9fd}
  .phlrow .phltxt{color:#1f2329;font-size:13.5px;font-weight:500;line-height:1.4;flex:1;min-width:0;word-break:break-word}
  .phright{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex:none}
  .phgo{color:#bcc3d0;font-size:16px}
  .phstat{font-size:13px;font-weight:600}
  .phstat.phok{color:#2f9e6b}
  .phstat.phno{color:#e5484d}
  .phcap{color:#9aa0ad;font-size:12.5px}

  /* 现场服务照片（页内拍照 / 引用） */
  .ph-hint{font-size:12px;color:var(--sub);margin:4px 0 10px}
  .ph-grid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .ph-thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 3px 9px rgba(30,50,110,.14)}
  .ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-thumb .ph-tag{position:absolute;left:0;top:0;background:rgba(0,0,0,.35);color:#fff;font-size:10px;padding:2px 6px;border-bottom-right-radius:8px}
  .ph-thumb .ph-x{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:13px;line-height:17px;text-align:center;cursor:pointer}
  .ph-add{width:80px;height:80px;border-radius:10px;border:1px dashed #c7cedd;background:#fafbfe;color:#9aa0ad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:24px;flex:none}
  .ph-add:active{background:#f1f4fb}
  .ph-add span{font-size:11px;font-weight:400}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}
  .mask.show{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:16px 16px 0 0;transform:translateY(100%);transition:.25s;padding:8px 0 22px}
  .sheet.show{transform:translateY(0)}
  .sheet-title{text-align:center;color:#9aa0ad;font-size:13px;padding:12px 0 8px}
  .sheet-opt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;background:#fff;text-align:center;font-size:16px;color:var(--val);padding:15px 0;cursor:pointer;border-top:1px solid var(--line)}
  .sheet-opt:active{background:#f4f6fb}
  .so-tag{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:600}
  .sheet-cancel{display:block;width:calc(100% - 32px);margin:14px 16px 0;height:46px;border:none;border-radius:10px;background:#f1f3f8;color:var(--val);font-size:16px;font-weight:600;cursor:pointer}
  .sheet-foot{display:flex;gap:10px;padding:6px 16px 0}
  .sheet-foot .sheet-cancel{width:auto;margin:0}
  .refgrid{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 8px}
  .refitem{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;cursor:pointer;flex:none;border:2px solid transparent}
  .refitem img{width:100%;height:100%;object-fit:cover;display:block}
  .refitem input{position:absolute;right:3px;top:3px;width:18px;height:18px;accent-color:#2b5ce6}
  .refempty{text-align:center;color:var(--sub);font-size:13px;padding:20px 0}

  /* 评分情况模块（自包含：回显服务登记内容，支持修改） */
  .scsec{font-size:15px;font-weight:700;color:#1f2329;padding:18px 16px 8px;display:flex;align-items:center}
  .scsec::before{content:"";width:3px;height:15px;background:#2b5ce6;border-radius:2px;margin-right:8px}
  .sccard{background:#fff;border-radius:14px;margin:0 16px;padding:4px 16px;box-shadow:0 6px 18px rgba(30,50,110,.06)}
  .scbox{border-bottom:1px solid #eef0f5;padding:12px 0}
  .scbox:last-child{border-bottom:none}
  .sclabel{color:#9aa0ad;font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .sclabel .req{color:#e5484d}
  .scinp{width:100%;border:none;outline:none;font-size:14px;color:#3a4050;background:transparent}
  .scinp::placeholder{color:#c2c8d4}
  .scrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eef0f5;padding:13px 0;cursor:pointer;transition:background .12s}
  .scrow:active{background:#f7f9fd}
  .scrow .scl{color:#1f2329;font-size:13.5px;font-weight:500;flex:1;min-width:0}
  .scr{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex:none}
  .scr .rcount{color:#e5484d;font-size:16px;font-weight:700;line-height:1}
  .scr .scgo{color:#bcc3d0;font-size:16px}
  .scbtn{width:100%;height:42px;border:1px solid #2b5ce6;background:#fff;color:#2b5ce6;border-radius:9px;font-size:14.5px;font-weight:600;cursor:pointer}
  .scbtn:active{background:#f1f5ff}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <div class="header">
    <div class="statusbar"><span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 17 11" width="17" height="11" fill="#fff"><rect x="0" y="7.6" width="3.1" height="3.4" rx="1"/><rect x="4.65" y="5.3" width="3.1" height="5.7" rx="1"/><rect x="9.3" y="3" width="3.1" height="8" rx="1"/><rect x="13.95" y="0.7" width="3.1" height="10.3" rx="1"/></svg>
        <svg viewBox="0 0 15.5 11.2" width="15.5" height="11.2" fill="#fff"><path d="M7.75 11.2 5.95 9.2a2.7 2.7 0 0 1 3.6 0L7.75 11.2Z"/><path d="M7.75 5.85c1.55 0 2.95.6 4 1.65L10.6 8.8a4.1 4.1 0 0 0-5.7 0L3.75 7.5a5.8 2.6 0 0 1 4-1.65Z" opacity=".92"/><path d="M7.75 1.95c2.55 0 4.9 1 6.65 2.65L13.25 5.9A7.95 7.95 0 0 0 7.75 3.7c-2.1 0-3.95.8-5.5 2.2L1.1 4.6A9.55 9.55 0 0 1 7.75 1.95Z" opacity=".82"/></svg>
        <svg viewBox="0 0 25 12" width="25" height="12"><rect x="0.7" y="0.7" width="20.3" height="10.6" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/><rect x="2.4" y="2.4" width="16.9" height="7.2" rx="1.8" fill="#fff"/><path d="M22.6 3.9v4.2c1.05-.35 1.8-1.2 1.8-2.1s-.75-1.75-1.8-2.1Z" fill="#fff" fill-opacity=".5"/></svg>
      </span>
    </div>
    <div class="navbar"><div class="back" onclick="history.back()">‹</div><div class="navtitle">报告整理</div></div>
  </div>

  <div class="body" id="body"></div>

  <!-- 报告预览 -->
  <div class="preview" id="preview">
    <div class="preview-head">
      <div class="preview-title">报告预览</div>
      <div class="preview-sub" id="previewSub"></div>
    </div>
    <div class="preview-body"><div class="pv-card" id="previewBody"></div></div>
    <div class="preview-foot">
      <button class="btn-ghost" onclick="closePreview()">重新整理</button>
      <button class="btn-main" onclick="submitReport()">提交报告</button>
    </div>
  </div>

  <div class="footer"><button class="btn-draft" onclick="saveDraft()">存为草稿</button><button class="btn-main" onclick="generateReport()">生成报告</button></div>
  <div class="home-ind"></div>

  <!-- 现场服务照片：来源弹层 -->
  <div class="mask" id="phMask" onclick="closePhSheet()"></div>
  <div class="sheet" id="phSheet">
    <div class="sheet-title" id="phSheetTitle">选择照片来源</div>
    <div id="phSheetOpts"></div>
    <div id="phSheetRefs" style="display:none;padding:0 16px"></div>
    <div class="sheet-foot" id="phSheetFoot"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const PROJECT = '安全生产标准化管理体系建设';
const q = new URLSearchParams(location.search);
const orderNo  = q.get('no') || 'YF2131900';
const project  = q.get('project') || PROJECT;
const COMPANY  = '福州无比欢信息科技有限公司';
const PLACE    = '福州马尾区海峡广场A座';
const DATE     = '2025.01.01-2025.01.05';

const PIN = '<svg viewBox="0 0 12 15" width="11" height="14" style="vertical-align:-2px;margin-left:4px"><path d="M6 0a6 6 0 0 0-6 6c0 4.2 6 9 6 9s6-4.8 6-9A6 6 0 0 0 6 0Zm0 8.2A2.2 2.2 0 1 1 6 3.8a2.2 2.2 0 0 1 0 4.4Z" fill="#2b5ce6"/></svg>';

/* 报告区块配置：自评报告及改进建议（PDF 上传或大模型生成）；评分明细（文档）；附件上传（多份文档） */
const BLOCKS = {
  selfassess: {sec:'自评报告及改进建议', doc:false, accept:'application/pdf', sub:'支持 PDF · 可大模型生成', ai:true},
  scores:     {sec:'评分明细',          doc:true,  accept:'.pdf,.doc,.docx', sub:'支持 PDF / Word'},
  attach:     {sec:'附件上传',          doc:true,  accept:'.pdf,.doc,.docx', sub:'支持 PDF / Word 多份', multi:true},
};

/* ===== 前项内容（现场评分）汇总，供大模型生成引用 ===== */
function prevContent(){
  let tables = [];
  try{ const s = localStorage.getItem('score_'+project); if(s) tables = JSON.parse(s); }catch(e){}
  if(!Array.isArray(tables) || !tables.length) tables = [{name:'安全管理类评分表'},{name:'现场用电类评分表'},{name:'消防安全类评分表'}];
  const names = tables.map(t=>(t&&t.name)||t).join('、');
  const done  = tables.filter(t=>t && t.done).length;
  return {names, done, total: tables.length};
}

/* ===== 本地存储的状态 ===== */
function stateKey(){ return 'report_std_' + orderNo; }
function loadState(){
  try{ return JSON.parse(localStorage.getItem(stateKey())) || {}; }catch(e){}
  return {};
}
function saveState(s){ try{ localStorage.setItem(stateKey(), JSON.stringify(s)); }catch(e){} }
let STATE = loadState();

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== 渲染 ===== */
function infoCard(){
  const row=(k,v,ic)=>`<div class="frow"><span class="k">${k}：</span><span class="v">${v}${ic||''}</span></div>`;
  return `<div class="sec-title">基本信息</div>
  <div class="card first info">
    ${row('预防服务工单', orderNo)}
    ${row('企业名称', COMPANY)}
    ${row('服务项目', project)}
    ${row('计划服务日期', DATE)}
    ${row('计划服务地点', PLACE, PIN)}
    ${row('联系人', '张三')}
    ${row('联系电话', '18000000000')}
  </div>`;
}

function statusLine(key){
  const st = STATE[key];
  if(!st || !st.type) return `<div class="rstat">当前状态：<span class="ustat no">未上传</span></div>`;
  if(st.type === 'pdf') return `<div class="rstat">已上传 PDF：<b>${esc(st.file || '')}</b></div>`;
  if(st.type === 'ai')  return `<div class="rstat">已由大模型生成并编辑：<b>${esc(st.file || '报告.doc')}</b></div>`;
  if(st.type === 'doc'){
    if(st.files && st.files.length) return `<div class="rstat">已上传文档 <b>${st.files.length}</b> 份：${esc(st.files.join('、'))}</div>`;
    return `<div class="rstat">已上传文档：<b>${esc(st.file || '')}</b></div>`;
  }
  return `<div class="rstat">当前状态：<span class="ustat no">未上传</span></div>`;
}

function blockHTML(key){
  const b = BLOCKS[key];
  const hasAI = !!b.ai;
  const mode = (STATE[key] && STATE[key].type === 'ai') ? 'ai' : 'pdf';
  const seg = hasAI ? `
    <div class="seg">
      <span class="chip ${mode==='pdf'?'on':''}" onclick="switchMode('${key}','pdf',this)">PDF 上传</span>
      <span class="chip ${mode==='ai'?'on':''}" onclick="switchMode('${key}','ai',this)">大模型生成</span>
    </div>` : '';
  const upIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2b5ce6" stroke-width="1.5"><path d="M8 11V3M5 6l3-3 3 3M3 11v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let uploadHTML;
  if(hasAI){
    const fname = (STATE[key] && STATE[key].type==='pdf' && STATE[key].file) ? STATE[key].file : '';
    uploadHTML = `
      <div class="pane ${mode==='pdf'?'show':''}" data-pane="${key}_pdf">
        <div class="upload">
          <button class="up-btn" type="button" onclick="document.getElementById('file_${key}').click()">${upIcon}上传 PDF</button>
          <span class="fname" id="name_${key}">${fname?esc(fname):'未选择文件'}</span>
          <input type="file" id="file_${key}" accept="${b.accept}" hidden onchange="onUpload('${key}',this)">
        </div>
      </div>
      <div class="pane ${mode==='ai'?'show':''}" data-pane="${key}_ai">
        <textarea class="ta" id="ta_${key}" placeholder="点击「大模型生成」根据前项内容生成，可人工编辑后保存">${esc((STATE[key]&&STATE[key].text)||'')}</textarea>
        <button class="aibtn" onclick="aiGen('${key}')">✦ 大模型生成（C5）</button>
        <button class="smbtn" onclick="saveText('${key}')">保存编辑结果</button>
      </div>`;
  } else if(b.multi){
    const list = (STATE[key] && STATE[key].files) ? STATE[key].files : [];
    const items = list.map((f,i)=>`<div class="docitem"><span class="docname">${esc(f)}</span><span class="docx" onclick="delAttach('${key}',${i})">×</span></div>`).join('');
    uploadHTML = `
      <div class="docs">
        <button class="up-btn" type="button" onclick="document.getElementById('file_${key}').click()">${upIcon}添加文档</button>
        <div class="doclist">${items}</div>
        <input type="file" id="file_${key}" accept="${b.accept}" multiple hidden onchange="onUploadMulti('${key}',this)">
      </div>`;
  } else {
    const fname = (STATE[key] && STATE[key].file) ? STATE[key].file : '';
    uploadHTML = `
      <div class="upload">
        <button class="up-btn" type="button" onclick="document.getElementById('file_${key}').click()">${upIcon}上传文档</button>
        <span class="fname" id="name_${key}">${fname?esc(fname):'未选择文件'}</span>
        <input type="file" id="file_${key}" accept="${b.accept}" hidden onchange="onUpload('${key}',this)">
      </div>`;
  }
  return `<div class="card">
    <div class="flbl">${b.sec}<span class="note">${b.sub}</span></div>
    ${seg}
    ${uploadHTML}
    ${statusLine(key)}
  </div>`;
}

/* ===== 现场照片（回显采集状态；点击跳转 照片采集.html） ===== */
const PHOTO_DEFAULT = {'企业（项目）门牌照':2, '技术人员现场服务照片':2, '现场检查照片':0};
function photoCount(n){
  try{ const v = localStorage.getItem('photo_'+n); if(v != null) return Math.max(0, +v||0); }catch(e){}
  return PHOTO_DEFAULT[n] || 0;
}
const PHOTOS = [
  {name:'企业（项目）门牌照', max:2, need:true},
  {name:'技术人员现场服务照片', max:2, need:true},
  {name:'现场检查照片', max:50},
];
function photoCard(){
  const html = PHOTOS.map(r=>{
    const right = r.need
      ? (photoCount(r.name) >= r.max ? `<span class="phstat phok">已完成</span>` : `<span class="phstat phno">未完成</span>`)
      : `<span class="phcap">${r.max}张</span>`;
    return `<div class="phlrow" onclick="goPhoto('${encodeURIComponent(r.name)}',${r.max})">
      <div class="phltxt">${r.name}</div>
      <div class="phright">${right}<span class="phgo">›</span></div>
    </div>`;
  }).join('');
  return `<div class="phsec">现场照片</div><div class="phcard">${html}</div>`;
}
function goPhoto(name,max){ location.href = '照片采集.html?title=' + name + '&max=' + max; }

function render(){
  document.getElementById('body').innerHTML =
    infoCard() +
    photoCard() +
    scoreCard() +
    servicePhotoCard() +
    blockHTML('selfassess') +
    blockHTML('scores') +
    blockHTML('attach');
}

/* ===== 现场服务照片（拍照 / 引用现场检查照片，最多 6 张） ===== */
const SRV_PHOTO_NAME = '现场服务照片';
const SRV_PHOTO_MAX = 6;
function photoImgs(name){
  try{ const s=localStorage.getItem('photo_imgs_'+name); if(s){ const a=JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){}
  return [];
}
function setPhotoImgs(name, arr){
  try{ localStorage.setItem('photo_imgs_'+name, JSON.stringify(arr)); }catch(e){}
}
function fileToDataURL(file, cb, maxPx){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const MAX=maxPx||1000; let w=img.width,h=img.height; const m=Math.max(w,h);
    if(m>MAX){const r=MAX/m;w=Math.round(w*r);h=Math.round(h*r);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.82));
  };img.onerror=()=>cb('');img.src=fr.result;};
  fr.readAsDataURL(file);
}
function servicePhotoCard(){
  const imgs = photoImgs(SRV_PHOTO_NAME);
  const full = imgs.length >= SRV_PHOTO_MAX;
  const grid = imgs.length ? imgs.map((s,i)=>`<div class="ph-thumb"><img src="${s}" alt=""><span class="ph-tag">${i+1}</span><span class="ph-x" onclick="delServicePhoto(${i})">×</span></div>`).join('') : '';
  const add = full ? '' : `<div class="ph-add" onclick="openPhSheet()">+<span>添加</span></div>`;
  return `<div class="sec">现场服务照片</div><div class="card">
    <div class="ph-hint">拍照 或 引用现场检查照片，最多 ${SRV_PHOTO_MAX} 张</div>
    <div class="ph-grid">${grid}${add}</div>
    <input type="file" id="phCam" accept="image/*" capture="environment" hidden onchange="onPhCam(this)">
  </div>`;
}
function delServicePhoto(idx){
  const a = photoImgs(SRV_PHOTO_NAME); if(idx<0||idx>=a.length) return;
  a.splice(idx,1); setPhotoImgs(SRV_PHOTO_NAME, a); render();
}
function openPhSheet(){
  if(photoImgs(SRV_PHOTO_NAME).length >= SRV_PHOTO_MAX){ toast('已达最大数量'); return; }
  document.getElementById('phSheetTitle').textContent = `选择照片来源（最多 ${SRV_PHOTO_MAX} 张）`;
  document.getElementById('phSheetOpts').style.display='';
  document.getElementById('phSheetRefs').style.display='none';
  document.getElementById('phSheetOpts').innerHTML =
    `<button class="sheet-opt" type="button" onclick="pickPhSrc('拍照')"><span class="so-tag" style="background:linear-gradient(135deg,#5b86f5,#3f6ef2)">拍</span>拍照</button>`+
    `<button class="sheet-opt" type="button" onclick="pickPhSrc('引用现场检查照片')"><span class="so-tag" style="background:linear-gradient(135deg,#f0a44a,#e0852a)">引</span>引用现场检查照片</button>`;
  document.getElementById('phSheetFoot').innerHTML = `<button class="sheet-cancel" type="button" onclick="closePhSheet()">取消</button>`;
  document.getElementById('phMask').classList.add('show');
  document.getElementById('phSheet').classList.add('show');
}
function closePhSheet(){ document.getElementById('phMask').classList.remove('show'); document.getElementById('phSheet').classList.remove('show'); }
function pickPhSrc(s){
  if(s==='引用现场检查照片'){ renderPhRefPick(); return; }
  closePhSheet();
  const el=document.getElementById('phCam'); if(el) el.click();
}
function onPhCam(inp){
  const files=inp.files?Array.from(inp.files):[]; if(!files.length) return;
  fileToDataURL(files[0], d=>{ if(d){ const a=photoImgs(SRV_PHOTO_NAME); if(a.length<SRV_PHOTO_MAX){ a.push(d); setPhotoImgs(SRV_PHOTO_NAME,a); } render(); toast('已添加照片'); } });
  inp.value='';
}
function renderPhRefPick(){
  const src = photoImgs('现场检查照片');
  const cur = photoImgs(SRV_PHOTO_NAME).length;
  const t=document.getElementById('phSheetTitle'); if(t) t.textContent = `引用现场检查照片（可再引用 ${Math.max(0,SRV_PHOTO_MAX-cur)} 张）`;
  document.getElementById('phSheetOpts').style.display='none';
  const r=document.getElementById('phSheetRefs'); r.style.display='';
  if(!src.length){
    r.innerHTML='<div class="refempty">暂无现场检查照片可引用，请先前往「现场照片 · 现场检查照片」采集。</div>';
    document.getElementById('phSheetFoot').innerHTML='<button class="sheet-cancel" type="button" onclick="openPhSheet()">返回</button>';
    return;
  }
  r.innerHTML='<div class="refgrid">'+src.map((s,i)=>`<label class="refitem"><img src="${s}" alt=""><input type="checkbox" value="${i}"></label>`).join('')+'</div>';
  document.getElementById('phSheetFoot').innerHTML=
    '<button class="sheet-cancel" type="button" onclick="openPhSheet()">返回</button>'+
    '<button class="btn-main" type="button" onclick="confirmPhRef()">确定引用</button>';
}
function confirmPhRef(){
  const picks=[...document.querySelectorAll('#phSheetRefs .refgrid input:checked')].map(x=>+x.value);
  if(!picks.length){ toast('请先勾选要引用的照片'); return; }
  const src=photoImgs('现场检查照片');
  let imgs=photoImgs(SRV_PHOTO_NAME), n=0;
  picks.forEach(i=>{ if(imgs.length<SRV_PHOTO_MAX && src[i]){ imgs.push(src[i]); n++; } });
  setPhotoImgs(SRV_PHOTO_NAME, imgs.slice(0,SRV_PHOTO_MAX));
  closePhSheet(); render(); toast('已引用 '+n+' 张照片');
}

/* ===== 评分情况（回显服务登记填写内容；标准总分、扣分/空项可修改） ===== */
function deductObj(){
  try{
    const o = JSON.parse(localStorage.getItem('deduct_'+project) || 'null');
    if(o && typeof o === 'object') return {standard:o.standard||'', entries:Array.isArray(o.entries)?o.entries:[]};
  }catch(e){}
  return {standard:'', entries:[]};
}
function saveDeductObj(o){ try{ localStorage.setItem('deduct_'+project, JSON.stringify(o)); }catch(e){} }
function kongObj(){
  try{ const a = JSON.parse(localStorage.getItem('kong_'+project) || 'null'); if(Array.isArray(a)) return a; }catch(e){}
  return [];
}
function deductSum(){ return deductObj().entries.reduce((s,e)=>s+(parseFloat(e.deduct)||0),0); }
function kongSum(){ return kongObj().reduce((s,e)=>s+(parseFloat(e.val)||0),0); }
function setStdScore(v){
  const o = deductObj(); o.standard = v; saveDeductObj(o);
}
function scoreSummary(){
  const o = deductObj(); const ds = deductSum(); const ks = kongSum();
  const std = o.standard ? ('标准总分 ' + o.standard + ' ｜ ') : '';
  return std + '扣分 -' + (ds>0?ds:0) + ' 分 ｜ 空项 ' + (ks>0?ks:0) + ' 分';
}
function scoreCard(){
  const o = deductObj(); const ds = deductSum(); const ks = kongSum();
  const hList = '扣分明细列表.html?no='+encodeURIComponent(orderNo)+'&project='+encodeURIComponent(project);
  const hAdd  = '新增扣分.html?no='+encodeURIComponent(orderNo)+'&project='+encodeURIComponent(project);
  const hKList= '空项明细列表.html?no='+encodeURIComponent(orderNo)+'&project='+encodeURIComponent(project);
  const hKAdd = '新增空项.html?no='+encodeURIComponent(orderNo)+'&project='+encodeURIComponent(project);
  return `<div class="scsec">评分情况</div><div class="sccard">
    <div class="scbox">
      <div class="sclabel"><span class="req">*</span>标准总分</div>
      <input class="scinp" id="stdScore" type="number" placeholder="请输入标准总分" value="${esc(o.standard)}" oninput="setStdScore(this.value)">
    </div>
    <div class="scrow" onclick="location.href='${hList}'">
      <div class="scl">扣分明细</div>
      <div class="scr"><span class="rcount" id="scDeductSum">${ds>0?('-'+ds):'0'} 分</span><span class="scgo">›</span></div>
    </div>
    <div class="scrow" onclick="location.href='${hKList}'">
      <div class="scl">空项明细</div>
      <div class="scr"><span class="rcount" id="scKongSum">${ks>0?ks:0} 分</span><span class="scgo">›</span></div>
    </div>
    <div class="scbox"><button class="scbtn" type="button" onclick="location.href='${hAdd}'">＋ 新增扣分</button></div>
    <div class="scbox"><button class="scbtn" type="button" onclick="location.href='${hKAdd}'">＋ 新增空项</button></div>
  </div>`;
}

/* ===== 交互 ===== */
function switchMode(key, mode, el){
  el.closest('.seg').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  document.querySelector(`[data-pane="${key}_pdf"]`).classList.toggle('show', mode==='pdf');
  const ai = document.querySelector(`[data-pane="${key}_ai"]`);
  if(ai) ai.classList.toggle('show', mode==='ai');
}

function onUpload(key, inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const type = BLOCKS[key].doc ? 'doc' : 'pdf';
  STATE[key] = {type, file: f.name};
  saveState(STATE);
  const label = document.getElementById('name_'+key);
  if(label) label.textContent = f.name;
  render();
  toast(type==='pdf' ? 'PDF 已上传' : '文档已上传');
}
function onUploadMulti(key, inp){
  const files = inp.files ? Array.from(inp.files).map(f=>f.name) : [];
  if(!files.length) return;
  const cur = (STATE[key] && STATE[key].files) ? STATE[key].files.slice() : [];
  STATE[key] = {type:'doc', files: cur.concat(files)};
  saveState(STATE);
  render();
  toast('已添加 '+files.length+' 份文档');
}
function delAttach(key, i){
  const st = STATE[key]; if(!st || !st.files) return;
  st.files.splice(i,1); STATE[key] = st; saveState(STATE); render();
  toast('已删除');
}

function aiGen(key){
  const c = prevContent();
  const text = `安全生产标准化管理体系建设 · 自评报告及改进建议
一、服务概况
受 ${COMPANY} 委托，于 ${DATE} 在 ${PLACE} 开展安全生产标准化现场评审服务。本次引用评分表：${c.names}（共 ${c.total} 项，已完成 ${c.done} 项）。
二、评审依据
《企业安全生产标准化基本规范》（GB/T 33000）及企业所属行业安全生产标准化评定标准。
三、评审内容（含评分明细）
1. 目标职责：安全生产目标、机构设置与人员配备。
2. 制度化管理：法规标准识别、规章制度、操作规程。
3. 教育培训：培训计划与人员持证上岗情况。
4. 现场管理：设备设施、作业安全、隐患排查治理。
5. 持续改进：绩效评定与自评报告。
四、主要问题
1. 部分安全管理制度未完全落实到基层岗位，执行记录不完整。
2. 现场隐患排查治理闭环管理有待加强，个别整改未留痕。
3. 从业人员安全教育培训覆盖面不足，特种作业人员持证管理需常态化。
五、改进建议
1. 完善制度宣贯与考核机制，确保各项制度落实到班组与个人。
2. 建立隐患排查治理台账，实现"排查—整改—验收"闭环。
3. 制定年度培训计划并严格实施，确保特种作业人员 100% 持证上岗。
4. 定期开展自评与绩效评定，推动安全生产标准化持续达标。
六、评审结论
企业安全生产标准化管理体系基本建立并有效运行，建议在制度落地与现场执行方面持续改进，形成闭环管理。`;
  document.getElementById('ta_'+key).value = text;
  STATE[key] = {type:'ai', text, file:(key+'_报告.doc')};
  saveState(STATE);
  render();
  toast('大模型已生成，可人工编辑');
}

function saveText(key){
  const v = document.getElementById('ta_'+key).value.trim();
  if(!v){ toast('内容为空，无法保存'); return; }
  STATE[key] = {type:'ai', text:v, file:(key+'_报告.doc')};
  saveState(STATE);
  render();
  toast('编辑结果已保存');
}

function saveDraft(){
  const status = JSON.parse(localStorage.getItem('sg_report_status') || '{}');
  status[orderNo] = '草稿';
  localStorage.setItem('sg_report_status', JSON.stringify(status));
  toast('已存为草稿');
}
function closePreview(){ document.getElementById('preview').classList.remove('show'); }
function generateReport(){
  const sub = k=>{
    const st = STATE[k];
    if(!st || !st.type) return '<span style="color:#e5484d">未整理</span>';
    if(st.type==='pdf') return '已上传 PDF：'+esc(st.file||'');
    if(st.type==='ai')  return '大模型生成并编辑（'+(st.text||'').length+' 字）';
    if(st.type==='doc'){
      if(st.files && st.files.length) return '已上传文档 '+st.files.length+' 份：'+esc(st.files.join('、'));
      return '已上传文档：'+esc(st.file||'');
    }
    return '已整理';
  };
  const spCount = photoImgs(SRV_PHOTO_NAME).length;
  document.getElementById('previewBody').innerHTML =
    '<div class="pv-sec">安全生产标准化管理体系建设 · 报告整理</div>'+
    '<div class="pv-row"><div class="pv-k">预防服务工单</div><div class="pv-v">'+esc(orderNo)+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">企业名称</div><div class="pv-v">'+esc(COMPANY)+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">服务项目</div><div class="pv-v">'+esc(project)+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">现场服务照片</div><div class="pv-v">'+(spCount?spCount+' 张（页内拍照 / 引用）':'未上传')+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">评分情况</div><div class="pv-v">'+esc(scoreSummary())+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">评分明细</div><div class="pv-v">'+sub('scores')+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">自评报告及改进建议</div><div class="pv-v">'+sub('selfassess')+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">附件上传</div><div class="pv-v">'+sub('attach')+'</div></div>'+
    '<div class="pv-row"><div class="pv-k">现场照片</div><div class="pv-v">'+esc(PHOTOS.map(p=>p.name+' '+photoCount(p.name)+'张').join('、'))+'</div></div>';
  document.getElementById('previewSub').textContent = '工单号 '+orderNo+' · '+project;
  document.getElementById('preview').classList.add('show');
}
function submitReport(){
  const none = ['selfassess','scores','attach'].filter(k=>!(STATE[k] && STATE[k].type));
  if(none.length){ toast('请先完成：' + none.map(k=>BLOCKS[k].sec).join('、')); return; }
  try{
    const status = JSON.parse(localStorage.getItem('sg_report_status') || '{}');
    status[orderNo] = '审核中';
    localStorage.setItem('sg_report_status', JSON.stringify(status));
  }catch(e){}
  toast('报告已提交');
  setTimeout(()=>{ location.href = '服务报告审核.html?no=' + encodeURIComponent(orderNo) + '&project=' + encodeURIComponent(project); }, 1100);
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}

render();
</script>
