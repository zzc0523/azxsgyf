<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面导航 · 事故预防服务</title>
<style>
  :root{--brand:#3b7cff;--brand-d:#2f63d6;--line:#eef0f5;--bg:#f4f6fb;--text:#1f2329;--sub:#8b91a0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .top{background:linear-gradient(135deg,#2f63d6,#5b86f5);padding:26px 32px;color:#fff;display:flex;align-items:center;gap:14px;}
  .top .logo{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:23px;}
  .top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
  .top p{margin:4px 0 0;font-size:13px;opacity:.85;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .group{margin-bottom:30px;}
  .group h2{font-size:15px;color:#5d6879;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .group h2::before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;}
  .item:hover{box-shadow:0 8px 20px rgba(30,50,110,.12);transform:translateY(-2px);border-color:#c7d0de;}
  .item .ic{width:40px;height:40px;border-radius:10px;background:#eef3ff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .item .t{font-size:14px;font-weight:600;}
  .item .sub{font-size:12px;color:var(--sub);margin-top:3px;word-break:break-all;}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:18px;}
  /* 嵌套子分组 */
  .subgroup{margin-top:10px;}
  .subgroup .subgroup{margin-left:8px;padding-left:10px;border-left:2px dashed #e3e8f2;}
  .subtitle{font-size:13px;font-weight:600;color:#39414f;margin:6px 2px;display:flex;align-items:center;gap:6px;}
  .subtitle::before{content:"";width:3px;height:13px;background:var(--brand);border-radius:2px;opacity:.7;}
  /* 小程序端：三大子分组横向并排 */
  .group.xcx > .grid{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;}
  .group.xcx > .grid > .subgroup{flex:1 1 300px;min-width:0;margin-top:0;}
  /* ===== 版本说明 ===== */
  .ver{max-width:1180px;margin:22px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 6px 18px rgba(30,50,110,.06);}
  .ver-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .ver-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .ver-acts{display:flex;gap:8px;}
  .vbtn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.12s;}
  .vbtn:hover{background:#eef3ff;}
  .vbtn.primary{background:var(--brand);color:#fff;}
  .vbtn.primary:hover{background:var(--brand-d);}
  .ver-body{font-size:13.5px;line-height:1.9;color:#3a4050;white-space:pre-wrap;word-break:break-word;}
  .ver-edit{display:none;width:100%;min-height:340px;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13.5px;line-height:1.8;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box;color:#3a4050;}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🧭</div>
  <div>
    <h1>事故预防服务 · 页面导航</h1>
    <p>综合风险减量服务平台 — 全部页面统一入口</p>
  </div>
</div>
<div class="ver">
  <div class="ver-head">
    <div class="ver-title">📌 版本说明</div>
    <div class="ver-acts">
      <button class="vbtn" id="verEdit" type="button" onclick="verEdit()">编辑</button>
      <button class="vbtn primary" id="verSave" type="button" onclick="verSave()" style="display:none">保存</button>
      <button class="vbtn" id="verCancel" type="button" onclick="verCancel()" style="display:none">取消</button>
    </div>
  </div>
  <div class="ver-body" id="verBody"></div>
  <textarea class="ver-edit" id="verEditArea"></textarea>
</div>
<div class="wrap" id="wrap"></div>
<div class="foot">点击任意卡片即可跳转到对应页面</div>

const wrap=document.getElementById('wrap');
function renderItems(items){
  return `<div class="grid">${items.map(renderNode).join('')}</div>`;
}
function renderNode(it){
  if(it.u){
    return `<a class="item" href="${it.u}"><div class="ic">${it.ic}</div><div><div class="t">${it.t}</div><div class="sub">${it.u}</div></div></a>`;
  }
  return `<div class="subgroup"><div class="subtitle">${it.t}</div>${renderItems(it.items)}</div>`;
}
wrap.innerHTML=GROUPS.map(g=>`<div class="group${g.name==='小程序端'?' xcx':''}"><h2>${g.name}</h2>${renderItems(g.items)}</div>`).join('');

function verStored(){ try{ return localStorage.getItem(VER_KEY); }catch(e){ return null; } }
function renderVer(){ const el=document.getElementById('verBody'); if(el) el.textContent = verStored() || VER_DEFAULT; }
function verEdit(){
  const a=document.getElementById('verEditArea');
  a.value = verStored() || VER_DEFAULT;
  document.getElementById('verBody').style.display='none';
  a.style.display='block';
  document.getElementById('verEdit').style.display='none';
  document.getElementById('verSave').style.display='inline-block';
  document.getElementById('verCancel').style.display='inline-block';
  a.focus();
}
function verCancel(){
  const a=document.getElementById('verEditArea');
  a.style.display='none';
  document.getElementById('verBody').style.display='block';
  document.getElementById('verEdit').style.display='inline-block';
  document.getElementById('verSave').style.display='none';
  document.getElementById('verCancel').style.display='none';
}
function verSave(){

  verCancel(); renderVer();
}
