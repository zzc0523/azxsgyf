<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面导航 · 事故预防服务</title>
<style>
  :root{--brand:#3b7cff;--brand-d:#2f63d6;--line:#eef0f5;--bg:#f4f6fb;--text:#1f2329;--sub:#8b91a0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .top{background:linear-gradient(135deg,#2f63d6,#5b86f5);padding:26px 32px;color:#fff;display:flex;align-items:center;gap:14px;}
  .top .logo{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:23px;}
  .top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
  .top p{margin:4px 0 0;font-size:13px;opacity:.85;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .group{margin-bottom:30px;}
  .group h2{font-size:15px;color:#5d6879;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .group h2::before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;}
  .item:hover{box-shadow:0 8px 20px rgba(30,50,110,.12);transform:translateY(-2px);border-color:#c7d0de;}
  .item .ic{width:40px;height:40px;border-radius:10px;background:#eef3ff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .item .t{font-size:14px;font-weight:600;}
  .item .sub{font-size:12px;color:var(--sub);margin-top:3px;word-break:break-all;}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:18px;}
  /* ===== 版本内容说明 ===== */
  .ver{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:26px;}
  .ver-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .ver-title{font-size:15px;font-weight:700;color:#2b3242;display:flex;align-items:center;gap:8px;}
  .ver-title::before{content:"";width:3px;height:16px;background:var(--brand);border-radius:2px;}
  .ver-acts{display:flex;gap:8px;}
  .vbtn{height:30px;padding:0 14px;border-radius:5px;border:1px solid #dfe4ed;background:#fff;color:#3a4354;font-size:13px;cursor:pointer;}
  .vbtn:hover{border-color:#c7d0de;}
  .vbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .vbtn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);}
  .ver-body{font-size:13.5px;line-height:1.9;color:#3a4354;white-space:pre-wrap;word-break:break-word;}
  .ver-edit{width:100%;min-height:180px;border:1px solid #dfe4ed;border-radius:6px;padding:12px;font-size:13.5px;line-height:1.9;color:#1f2329;font-family:inherit;resize:vertical;}
  .ver-edit:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12);outline:none;}
  .vtoast{position:fixed;left:50%;top:28px;transform:translateX(-50%) translateY(-8px);background:rgba(20,28,46,.92);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:.2s;}
  .vtoast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🧭</div>
  <div>
    <h1>事故预防服务 · 页面导航</h1>
    <p>综合风险减量服务平台 — 全部页面统一入口</p>
  </div>
</div>

<div class="wrap">
  <div class="ver">
    <div class="ver-head">
      <div class="ver-title">📌 版本内容说明</div>
      <div class="ver-acts">
        <button class="vbtn" id="verEdit" onclick="verEdit()">编辑</button>
        <button class="vbtn primary" id="verSave" style="display:none" onclick="verSave()">保存</button>
        <button class="vbtn" id="verCancel" style="display:none" onclick="verCancel()">取消</button>
      </div>
    </div>
    <div class="ver-body" id="verView"></div>
    <textarea class="ver-edit" id="verInput" style="display:none"></textarea>
  </div>
</div>

<div class="wrap" id="wrap"></div>
<div class="foot">点击任意卡片即可跳转到对应页面</div>
<div class="vtoast" id="verToast"></div>

<script>
/* 页面分组与入口，新增页面时在此追加即可 */
const GROUPS=[
  {name:'保险机构端（管理后台）', items:[
    {t:'隐患检查表管理', u:'检查表管理.html', ic:'📋'},
    {t:'评分表管理', u:'评分表管理.html', ic:'⭐'},
    {t:'投保查询', u:'投保查询.html', ic:'🔍'},
    {t:'服务计划管理', u:'服务计划管理.html', ic:'📅'},
    {t:'服务报告审核', u:'服务报告审核.html', ic:'✅'},
    {t:'事故预防服务需求', u:'事故预防服务需求.html', ic:'📨'},
  ]},
  {name:'服务流程（小程序端）', items:[
    {t:'首页', u:'首页.html', ic:'🏠'},
    {t:'登录页', u:'登录页.html', ic:'🔑'},
    {t:'事故预防服务', u:'事故预防服务.html', ic:'🛡️'},
    {t:'事故预防服务管理', u:'事故预防服务管理.html', ic:'🗂️'},
    {t:'服务登记', u:'服务登记.html', ic:'📝'},
    {t:'服务确认', u:'服务确认.html', ic:'✔️'},
    {t:'待执行详情', u:'待执行详情.html', ic:'📌'},
  ]},
  {name:'风险与隐患', items:[
    {t:'风险列表', u:'风险列表.html', ic:'⚠️'},
    {t:'隐患列表', u:'隐患列表.html', ic:'🚨'},
    {t:'新增风险（辨识评估）', u:'新增风险_安全风险辨识评估评价.html', ic:'➕'},
    {t:'新增隐患（重大排查）', u:'新增隐患_生产安全重大事故隐患排查.html', ic:'➕'},
  ]},
  {name:'报告整理', items:[
    {t:'报告·安全风险辨识评估评价', u:'报告整理_安全风险辨识评估评价.html', ic:'📄'},
    {t:'报告·安全生产标准化管理体系建设', u:'报告整理_安全生产标准化管理体系建设.html', ic:'📄'},
    {t:'报告·安全生产宣传教育培训', u:'报告整理_安全生产宣传教育培训.html', ic:'📄'},
    {t:'报告·安全生产应急救援演练', u:'报告整理_安全生产应急救援演练.html', ic:'📄'},
    {t:'报告·安全生产应急预案编制', u:'报告整理_安全生产应急预案编制.html', ic:'📄'},
    {t:'报告·生产安全重大事故隐患排查', u:'报告整理_生产安全重大事故隐患排查.html', ic:'📄'},
    {t:'报告PDF预览', u:'报告PDF预览.html', ic:'🖨️'},
  ]},
  {name:'服务登记（分项）', items:[
    {t:'登记·辨识评估评价', u:'服务登记_安全风险辨识评估评价.html', ic:'📝'},
    {t:'登记·标准化体系建设', u:'服务登记_安全生产标准化管理体系建设.html', ic:'📝'},
    {t:'登记·宣传教育培训', u:'服务登记_安全生产宣传教育培训.html', ic:'📝'},
    {t:'登记·应急救援演练', u:'服务登记_安全生产应急救援演练.html', ic:'📝'},
    {t:'登记·应急预案编制', u:'服务登记_安全生产应急预案编制.html', ic:'📝'},
    {t:'登记·重大隐患排查', u:'服务登记_生产安全重大事故隐患排查.html', ic:'📝'},
  ]},
  {name:'采集与现场', items:[
    {t:'打卡签到', u:'打卡签到.html', ic:'📍'},
    {t:'签退', u:'签退.html', ic:'🚪'},
    {t:'人脸活体检测', u:'人脸活体检测.html', ic:'🙂'},
    {t:'照片采集', u:'照片采集.html', ic:'📷'},
    {t:'现场评分', u:'现场评分.html', ic:'⭐'},
    {t:'应急预案编制信息采集', u:'应急预案编制信息采集.html', ic:'🧾'},
  ]},
];

/* ===== 版本内容说明（纯文本，编辑后存 localStorage） ===== */
const VER_KEY='index_version_notes';
const VER_DEFAULT='v1.0.0（2026-09-20）\n'
  +'- 新增 index 导航页：汇总跳转全部子页面；\n'
  +'- 检查表管理：题目配置新增字数限制、全选/批量删除、去除序号列；\n'
  +'- 评分表管理：新增「适用行业」字段（下拉选择），新增时默认回填当前账号；示例数据补充适用行业；\n'
  +'- 全局统一「适用行业」枚举：煤矿 / 非煤矿山 / 危险化学品 / 烟花爆竹 / 交通运输 / 建筑施工 / 民用爆炸物品 / 金属冶炼 / 渔业生产 / 其他。';
let _verDraft='';
function verLoad(){ try{const s=localStorage.getItem(VER_KEY);return s!=null?s:VER_DEFAULT;}catch(e){return VER_DEFAULT;} }
function renderVer(){ const t=verLoad(); document.getElementById('verView').textContent=t||'（暂无版本说明）'; }
function verEdit(){ _verDraft=verLoad(); document.getElementById('verInput').value=_verDraft;
  document.getElementById('verView').style.display='none'; document.getElementById('verInput').style.display='block';
  document.getElementById('verEdit').style.display='none'; document.getElementById('verSave').style.display='inline-flex'; document.getElementById('verCancel').style.display='inline-flex'; }
function verCancel(){ document.getElementById('verView').style.display='block'; document.getElementById('verInput').style.display='none';
  document.getElementById('verEdit').style.display='inline-flex'; document.getElementById('verSave').style.display='none'; document.getElementById('verCancel').style.display='none'; }
function verSave(){ const v=document.getElementById('verInput').value; try{localStorage.setItem(VER_KEY,v);}catch(e){}
  document.getElementById('verView').textContent=v||'（暂无版本说明）'; verCancel(); verToast('版本说明已保存'); }

const wrap=document.getElementById('wrap');
wrap.innerHTML=GROUPS.map(g=>{
  const cards=g.items.map(it=>`<a class="item" href="${it.u}"><div class="ic">${it.ic}</div><div><div class="t">${it.t}</div><div class="sub">${it.u}</div></div></a>`).join('');
  return `<div class="group"><h2>${g.name}</h2><div class="grid">${cards}</div></div>`;
}).join('');
renderVer();

let _vt;
function verToast(m){const t=document.getElementById('verToast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(_vt);_vt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
